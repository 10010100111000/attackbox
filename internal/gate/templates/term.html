<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AttackBox CLI - {{.Box.ID}}</title>
  <link rel="stylesheet" href="/xterm/xterm.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #09090b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e4e4e7;
    }

    #top-bar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: #121215;
      border-bottom: 1px solid #27272a;
      user-select: none;
    }

    .bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #f4f4f5;
      letter-spacing: -0.01em;
    }

    .box-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #a1a1aa;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #71717a;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #71717a;
      transition: background-color 0.2s ease;
    }
    .dot.connected { background: #10b981; box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    .dot.connecting { background: #f59e0b; animation: pulse 1.5s infinite; }
    .dot.preempted { background: #ef4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .bar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-action:hover {
      color: #f4f4f5;
      background: #27272a;
      border-color: #3f3f46;
    }

    #term-container {
      position: absolute;
      top: 42px;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 10px;
    }

    /* 浮动单活跃会话抢占遮罩层 */
    #preempted-modal {
      display: none;
      position: absolute;
      inset: 0;
      top: 42px;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(4px);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      max-width: 420px;
      width: 90%;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .modal-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #f59e0b;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: #f4f4f5;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 13px;
      line-height: 1.5;
      color: #a1a1aa;
      margin-bottom: 20px;
    }

    .btn-reclaim {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 16px;
      background: #ffffff;
      color: #09090b;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn-reclaim:hover {
      background: #f4f4f5;
    }
  </style>
</head>
<body>
  <!-- 顶部轻量状态与操作栏 -->
  <div id="top-bar">
    <div class="bar-left">
      <div class="brand-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
        <span>AttackBox CLI</span>
      </div>
      <div class="box-badge">parrot@{{.Box.ID}}</div>
      <div class="status-pill">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">连接中...</span>
      </div>
    </div>

    <div class="bar-right">
      <button class="btn-action" id="btn-clear" title="清空终端屏幕">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>清屏</span>
      </button>
      <button class="btn-action" id="btn-fullscreen" title="切换全屏模式">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <span id="fs-text">全屏</span>
      </button>
    </div>
  </div>

  <!-- 终端画布容器 -->
  <div id="term-container"></div>

  <!-- 单活跃会话抢占提示遮罩 -->
  <div id="preempted-modal">
    <div class="modal-card">
      <div class="modal-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <div class="modal-title">终端会话已在其他窗口接入</div>
      <div class="modal-desc">
        为保证输入上下文独立与系统安全，当前沙箱严格采用单活跃会话机制。此窗口输入已暂停。
      </div>
      <button class="btn-reclaim" id="btn-reclaim">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span>切回此窗口接管终端</span>
      </button>
    </div>
  </div>

  <script src="/xterm/xterm.js"></script>
  <script src="/xterm/addon-fit.js"></script>
  <script>
  (function () {
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const preemptedModal = document.getElementById('preempted-modal');
    const btnReclaim = document.getElementById('btn-reclaim');
    const btnClear = document.getElementById('btn-clear');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const fsText = document.getElementById('fs-text');

    // 初始化 xterm
    const term = new Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      scrollback: 3000,
      fontFamily: "'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace",
      fontSize: 13,
      lineHeight: 1.25,
      theme: {
        background: '#09090b',
        foreground: '#e4e4e7',
        cursor: '#10b981',
        cursorAccent: '#09090b',
        selectionBackground: 'rgba(255, 255, 255, 0.16)',
        black: '#18181b',
        red: '#ef4444',
        green: '#22c55e',
        yellow: '#eab308',
        blue: '#3b82f6',
        magenta: '#a855f7',
        cyan: '#06b6d4',
        white: '#f4f4f5',
        brightBlack: '#71717a',
        brightRed: '#f87171',
        brightGreen: '#4ade80',
        brightYellow: '#fde047',
        brightBlue: '#60a5fa',
        brightMagenta: '#c084fc',
        brightCyan: '#22d3ee',
        brightWhite: '#ffffff'
      }
    });

    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('term-container'));
    fit.fit();

    const scheme = location.protocol === 'https:' ? 'wss://' : 'ws://';
    let ws = null;
    let manualPreempted = false;
    let retryTimer = null;
    let retryCount = 0;

    function setStatus(state, msg) {
      statusDot.className = 'dot ' + state;
      statusText.textContent = msg;
    }

    function sendSize() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ cols: term.cols, rows: term.rows }));
      }
    }

    function connect() {
      if (retryTimer) {
        clearTimeout(retryTimer);
        retryTimer = null;
      }
      manualPreempted = false;
      preemptedModal.style.display = 'none';
      setStatus('connecting', '连接中...');

      if (ws) {
        try { ws.close(); } catch (_) {}
      }

      ws = new WebSocket(scheme + location.host + '/term/ws');
      ws.binaryType = 'arraybuffer';

      ws.onopen = function () {
        retryCount = 0;
        setStatus('connected', '已就绪');
        sendSize();
        term.focus();
      };

      ws.onmessage = function (e) {
        if (typeof e.data === 'string') {
          // 纯文本消息通常为后台提示
          return;
        }
        term.write(new Uint8Array(e.data));
      };

      ws.onclose = function (e) {
        // 4001: 单活跃会话被抢占
        if (e.code === 4001) {
          manualPreempted = true;
          setStatus('preempted', '会话挂起');
          preemptedModal.style.display = 'flex';
          return;
        }

        // 环境已被销毁或释放
        if (e.reason === 'environment destroyed' || e.code === 1000) {
          manualPreempted = true;
          setStatus('preempted', '环境已销毁');
          term.write('\r\n\r\n\x1b[1;33m[AttackBox] 沙箱环境已被销毁释放，终端会话已终止。\x1b[0m\r\n');
          return;
        }

        setStatus('preempted', '连接断开');
        if (!manualPreempted) {
          retryCount++;
          const delay = Math.min(5000, 1000 * retryCount);
          setStatus('connecting', `重连中 (${retryCount})...`);
          retryTimer = setTimeout(connect, delay);
        }
      };

      ws.onerror = function () {
        setStatus('preempted', '网络错误');
      };
    }

    term.onData(function (data) {
      if (manualPreempted) return;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(new TextEncoder().encode(data));
      }
    });

    // 窗口尺寸自适应
    let resizeTimer = null;
    window.addEventListener('resize', function () {
      fit.fit();
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(sendSize, 100);
    });

    // 辅助工具按钮
    btnClear.addEventListener('click', function () {
      term.clear();
      term.focus();
    });

    btnFullscreen.addEventListener('click', function () {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          fsText.textContent = '退出全屏';
        }).catch(() => {});
      } else {
        document.exitFullscreen().then(() => {
          fsText.textContent = '全屏';
        }).catch(() => {});
      }
    });

    document.addEventListener('fullscreenchange', function () {
      if (!document.fullscreenElement) {
        fsText.textContent = '全屏';
      }
      setTimeout(() => { fit.fit(); sendSize(); }, 150);
    });

    btnReclaim.addEventListener('click', function () {
      connect();
    });

    // 点击终端任意区域自动获取焦点
    document.getElementById('term-container').addEventListener('click', function () {
      term.focus();
    });

    // 启动初始连接
    connect();
  })();
  </script>
</body>
</html>
