server:
  listen_addr: "127.0.0.1:18080"
  cors_allowed_origins:
    - "*"

database:
  path: "/var/lib/attackbox/attackbox.db"

cluster:
  cluster_secret: "attackbox_cluster_secret_change_me_in_prod!"
  heartbeat_timeout_sec: 15
  rpc_timeout_sec: 30

auth:
  ed25519_private_key: ""
  jwt_expire_hours: 24
  ticket_ttl_sec: 60
  initial_admin_username: "admin"
  initial_admin_password: "AdminSecurePassword123!"
  initial_admin_email: "admin@attackbox.local"

sandbox:
  resources:
    memory_max_mb: 2048
    memory_swap_max_mb: 0
    pids_max: 512
    cpu_weight: 100
    io_write_bytes_sec: 20971520 # 20MB/s
    io_write_iops: 500
  storage:
    tmpfs_tmp_size: "512M"
    tmpfs_run_size: "256M"
  ttl_seconds: 7200
  idle_seconds: 1800
  reaper_interval_sec: 30
