compose_labs:
  enabled: false
  # Set only after the local network acceptance test has passed on this host.
  network_verified: false
  state_dir: "/var/lib/attackbox/compose-labs"
  socket_path: "/var/run/docker.sock"
  # Separate from legacy 10.201.0.0/16 while migrating.
  pool: "10.202.0.0/16"

node:
  node_id: "node-primary"
  cluster_secret: "attackbox_cluster_secret_change_me_in_prod!"
  control_url: "ws://127.0.0.1:3000/cluster/connect"
  heartbeat_interval_sec: 3

gateway:
  listen_addr: "0.0.0.0:8443"
  # Must equal the controller's SANDBOX_NODES_JSON publicDataUrl. ws:// is only
  # accepted for loopback; the browser rewrites the host to the page host.
  public_data_url: "ws://127.0.0.1:8443"
  tls_enabled: false

runtime:
  base_rootfs: "/var/lib/attackbox/base_rootfs"
  instances_dir: "/var/lib/attackbox/instances"
  cgroup_root: "/sys/fs/cgroup/attackbox"
  limits:
    pids_max: 256
    memory_max_mb: 1024
    memory_swap_max_mb: 0
    cpu_weight: 100
    io_write_bytes_sec: 20971520
    io_write_iops: 1000
  disk_guard:
    enabled: true
    check_interval_sec: 3
    min_free_space_mb: 5120
    warn_free_space_mb: 10240
  tmpfs:
    tmp_size: "512M"
    run_size: "256M"

network:
  bridge_name: "br-attackbox"
  gateway_ip: "10.200.0.1"
  subnet_cidr: "10.200.0.0/16"
  egress_interface: ""

  docker_targets:
    enabled: true
    socket_path: "/var/run/docker.sock"
    name: "attackbox-targets"
    bridge_name: "br-ab-targets"
    subnet_cidr: "10.201.0.0/16"
    gateway_ip: "10.201.0.1"
