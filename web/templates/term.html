<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AttackBox 虚拟终端空间 - {{.Box.ID}}</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="stylesheet" href="/xterm/xterm.css">
  <script src="/static/winbox.bundle.min.js"></script>
  <link rel="stylesheet" href="/static/term.css">
</head>
<body>

  <!-- 顶部极简现代悬浮控制栏 (HUD Island，与 Dashboard 统一设计语言) -->
  <header id="hud-island">
    <div class="hud-brand">
      <div class="hud-logo">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
      <span class="hud-title">AttackBox CLI</span>
      <span class="hud-badge">{{.Box.User}}@{{.Box.ID}}</span>
    </div>

    <div class="hud-actions">
      <!-- 新建终端 -->
      <button onclick="createTerminalWindow()" class="hud-btn hud-btn-primary" title="新建独立命令行窗口 (Ctrl+Alt+T)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>新建终端</span>
      </button>

      <!-- Win7 Flip 3D 层叠切换 -->
      <button onclick="toggleFlip3D()" class="hud-btn" title="Win7 风格 3D 旋转层叠 (支持滚轮切换与点击选中)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>3D 层叠</span>
      </button>

      <!-- 网格平铺 -->
      <button onclick="tileWindows()" class="hud-btn" title="整齐平铺所有打开的终端窗口">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>平铺排列</span>
      </button>

      <!-- 阶梯排列 -->
      <button onclick="cascadeWindows()" class="hud-btn" title="斜向阶梯排列所有窗口">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="13" height="13" rx="2"></rect>
          <path d="M7 17v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3"></path>
        </svg>
        <span>阶梯排列</span>
      </button>

      <div class="hud-divider"></div>

      <!-- 关闭全部 -->
      <button onclick="closeAllWindows()" class="hud-btn hud-btn-danger" title="关闭当前所有终端窗口">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>全部关闭</span>
      </button>
    </div>
  </header>

  <!-- 可自由拖放位置的快捷记事本悬浮胶囊 (Draggable Dock) -->
  <div id="dock-notepad" title="按住手柄可自由拖动位置，点击打开命令记事本">
    <div class="dock-drag-handle" title="拖动手柄">
      <svg width="7" height="11" viewBox="0 0 8 12" fill="currentColor">
        <circle cx="2" cy="2" r="1.2"></circle>
        <circle cx="6" cy="2" r="1.2"></circle>
        <circle cx="2" cy="6" r="1.2"></circle>
        <circle cx="6" cy="6" r="1.2"></circle>
        <circle cx="2" cy="10" r="1.2"></circle>
        <circle cx="6" cy="10" r="1.2"></circle>
      </svg>
    </div>
    <button class="dock-btn" title="打开/关闭常用命令与记事本">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        <path d="M9 12h6"></path>
        <path d="M9 16h4"></path>
      </svg>
      <span>记事本</span>
    </button>
  </div>

  <!-- Windows Aero Snap 贴靠半透明虚线预览框 -->
  <div id="snap-preview"></div>

  <!-- Win7 Flip 3D 模式底部提示与操作胶囊 -->
  <div id="flip-hud">
    <span class="flip-counter" id="flip-counter">1 / 1</span>
    <span>滚动滚轮切换 · 单击窗口选中 · ESC 退出</span>
    <button onclick="exitFlip3D(true)" class="flip-exit-btn">退出 3D</button>
  </div>

  <!-- 虚拟桌面工作区画布 -->
  <main id="workspace-canvas">
    <div id="empty-hint" style="display: none;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"></polyline>
        <line x1="12" y1="19" x2="20" y2="19"></line>
      </svg>
      <p>当前工作区暂无打开的命令行终端</p>
      <p class="hint-sub">点击上方「新建终端」或按快捷键 Ctrl+Alt+T 即可开启窗口</p>
      <button onclick="createTerminalWindow()" class="empty-create-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>新建第一个终端</span>
      </button>
    </div>
  </main>

  <!-- 挂载 WinBox 的记事本模板内容 (由 WinBox 原生挂载并支持自由拖拽与 8 向缩放) -->
  <div id="notepad-app" style="display: none; height: 100%;">
    <div class="np-container">
      <div class="np-header">
        <div class="np-input-row">
          <input type="text" id="np-input" class="np-input" placeholder="输入常用命令、Payload 或文本行，按 Enter 添加..." />
          <button id="np-btn-add" class="np-btn np-btn-primary">添加行</button>
          <button id="np-btn-toggle-batch" class="np-btn np-btn-secondary" title="展开多行批量粘贴">批量</button>
        </div>
        <div id="np-batch-panel" class="np-batch-panel hidden">
          <textarea id="np-batch-textarea" class="np-batch-textarea" placeholder="在此粘贴多行文本，每行将自动拆解为一条可点击复制或直接键入的独立卡片..."></textarea>
          <div class="np-batch-actions">
            <button id="np-btn-batch-confirm" class="np-btn np-btn-primary">确认拆分导入</button>
            <button id="np-btn-batch-cancel" class="np-btn np-btn-secondary">收起</button>
          </div>
        </div>
      </div>

      <div class="np-list" id="np-list">
        <!-- 动态渲染一列一列的行卡片 -->
      </div>

      <div class="np-footer">
        <span>💡 单击整行直接复制，点击「键入」发送至当前活动终端</span>
        <button id="np-btn-clear-all" class="np-action-btn">清空列表</button>
      </div>
    </div>
  </div>

  <!-- 浮动反馈提示 Toast -->
  <div id="term-toast">提示信息</div>

  <script>
    window.boxSlot = "{{.Box.ID}}";
    window.boxUser = "{{.Box.User}}";
    window.currentUser = "{{.User}}";
  </script>
  <script src="/xterm/xterm.js"></script>
  <script src="/xterm/addon-fit.js"></script>
  <script src="/static/term.js"></script>
</body>
</html>
