<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-zinc-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AttackBox 远程桌面 - {{.Box.ID}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #09090b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e4e4e7;
    }
    #screen {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #screen > canvas {
      outline: none;
    }

    /* 顶部极简浮动工具条 (鼠标滑过或聚焦时完全显现) */
    #toolbar {
      position: fixed;
      top: 10px;
      right: 16px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      background: rgba(18, 18, 21, 0.85);
      border: 1px solid rgba(39, 39, 42, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      opacity: 0.35;
      transition: opacity 0.2s ease, transform 0.2s ease;
      user-select: none;
    }
    #toolbar:hover, #toolbar:focus-within {
      opacity: 1;
    }

    .toolbar-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #f4f4f5;
      padding-right: 6px;
      border-right: 1px solid #27272a;
    }

    .toolbar-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      padding: 1px 6px;
      background: #27272a;
      color: #a1a1aa;
      border-radius: 4px;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
      color: #d4d4d8;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .tool-btn:hover {
      background: #27272a;
      color: #ffffff;
    }

    /* 状态指示浮胶囊 */
    #status-pill {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(18, 18, 21, 0.9);
      border: 1px solid rgba(39, 39, 42, 0.8);
      backdrop-filter: blur(8px);
      color: #e4e4e7;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(228, 228, 231, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status-pill.connected {
      opacity: 0;
      transform: translate(-50%, -12px);
      pointer-events: none;
    }
    #status-pill.warning {
      background: rgba(30, 25, 10, 0.95);
      border-color: rgba(245, 158, 11, 0.6);
      color: #fef3c7;
    }
    #status-pill.error {
      background: rgba(127, 29, 29, 0.9);
      border-color: rgba(239, 68, 68, 0.6);
      color: #fecaca;
    }
    .pill-btn {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: #ffffff;
      color: #09090b;
      font-size: 11px;
      font-weight: 600;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      margin-left: 6px;
      transition: background-color 0.15s ease;
    }
    .pill-btn:hover { background: #f4f4f5; }
  </style>
</head>
<body>
  <!-- 顶部浮动快捷条 -->
  <div id="toolbar">
    <div class="toolbar-brand">
      <span>TigerVNC + MATE</span>
      <span class="toolbar-badge">{{.User}}@{{.Box.ID}}</span>
    </div>
    <button class="tool-btn" id="btn-cad" title="向桌面发送 Ctrl+Alt+Del 快捷键组合">Ctrl+Alt+Del</button>
    <button class="tool-btn" id="btn-fs" title="切换全屏显示">全屏</button>
    <button class="tool-btn" id="btn-reload" title="重新连入桌面">重连</button>
  </div>

  <!-- 状态指示器 -->
  <div id="status-pill">
    <div class="spinner" id="status-spinner"></div>
    <span id="status-text">正在连接图形远程桌面...</span>
  </div>

  <!-- Canvas 挂载视口 -->
  <div id="screen"></div>

  <script type="module">
    import RFB from '/vnc/core/rfb.js';

    const pill = document.getElementById('status-pill');
    const pillText = document.getElementById('status-text');
    const spinner = document.getElementById('status-spinner');
    const screen = document.getElementById('screen');

    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}/vnc/ws`;

    let rfb = null;
    let retryCount = 0;
    let reconnectTimer = null;

    function connect() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
      if (rfb) {
        try { rfb.disconnect(); } catch (e) {}
        rfb = null;
      }

      pill.className = '';
      pill.style.display = 'flex';
      spinner.style.display = 'block';
      pillText.textContent = retryCount > 0 ? `正在尝试重新连接 (${retryCount})...` : '正在连接图形远程桌面...';

      try {
        rfb = new RFB(screen, wsUrl, {
          wsProtocols: ['binary']
        });

        rfb.scaleViewport = true;
        rfb.resizeSession = false;
        rfb.clipViewport = false;
        rfb.compressionLevel = 2;
        rfb.qualityLevel = 6;

        rfb.addEventListener('connect', () => {
          retryCount = 0;
          pill.classList.add('connected');
          setTimeout(() => {
            if (pill.classList.contains('connected')) {
              pill.style.display = 'none';
            }
          }, 400);
          rfb.focus();
        });

        rfb.addEventListener('disconnect', (e) => {
          pill.style.display = 'flex';
          pill.classList.remove('connected');
          spinner.style.display = 'none';

          const wsCode = rfb._sock && rfb._sock._websocket ? rfb._sock._websocket.code : 0;
          if (wsCode === 4001) {
            pill.className = 'warning';
            pillText.innerHTML = '桌面已在其他窗口接入，本窗口已挂起 <button class="pill-btn" id="btn-reclaim-vnc">切回此窗口</button>';
            const reclaimBtn = document.getElementById('btn-reclaim-vnc');
            if (reclaimBtn) reclaimBtn.onclick = () => connect();
            return;
          }

          pill.classList.add('error');
          const isClean = e.detail && e.detail.clean;
          pillText.innerHTML = isClean
            ? '远程桌面已断开 <button class="pill-btn" id="btn-retry-vnc">重新连接</button>'
            : '连接中断，将在 2 秒后尝试重连... <button class="pill-btn" id="btn-retry-vnc">立即重连</button>';

          const retryBtn = document.getElementById('btn-retry-vnc');
          if (retryBtn) retryBtn.onclick = () => connect();

          if (!isClean) {
            retryCount++;
            reconnectTimer = setTimeout(connect, 2000);
          }
        });

        rfb.addEventListener('securityfailure', () => {
          pill.style.display = 'flex';
          pill.classList.remove('connected');
          spinner.style.display = 'none';
          pill.classList.add('error');
          pillText.textContent = '远程桌面鉴权失败，请重新登录';
        });

      } catch (err) {
        pill.style.display = 'flex';
        pill.classList.add('error');
        spinner.style.display = 'none';
        pillText.textContent = '初始化失败: ' + err.message;
      }
    }

    document.getElementById('btn-cad').onclick = () => {
      if (rfb) rfb.sendCtrlAltDel();
    };
    document.getElementById('btn-fs').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };
    document.getElementById('btn-reload').onclick = () => {
      retryCount = 0;
      connect();
    };

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', connect);
    } else {
      connect();
    }
  </script>
</body>
</html>
