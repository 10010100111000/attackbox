name: web-ci

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: browser-test-only
          POSTGRES_DB: attackbox_browser_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Shared component browser regressions
        run: npm run test:ui-components

      - name: Production auth form snapshots
        run: npm run test:auth-styles

      - name: Content discovery and homepage browser regressions
        env:
          DATABASE_URL: postgres://postgres:browser-test-only@127.0.0.1:5432/attackbox_browser_test
          CONTENT_TEST_DATABASE_URL: postgres://postgres:browser-test-only@127.0.0.1:5432/attackbox_browser_test
          CONTENT_TEST_BASE_URL: http://127.0.0.1:3158
          CONTENT_DATA_DIR: ${{ runner.temp }}/attackbox-content
          NITRO_HOST: 127.0.0.1
          NITRO_PORT: 3158
        run: |
          npm run db:migrate
          node .output/server/index.mjs > "$RUNNER_TEMP/attackbox-browser-server.log" 2>&1 &
          test_server_pid=$!
          trap 'kill "$test_server_pid"; cat "$RUNNER_TEMP/attackbox-browser-server.log"' EXIT
          node --input-type=module <<'JS'
          import { setTimeout } from 'node:timers/promises'
          let ready = false
          for (let attempt = 0; attempt < 50; attempt++) {
            try {
              const response = await fetch(`${process.env.CONTENT_TEST_BASE_URL}/api/modules`, { signal: AbortSignal.timeout(1000) })
              if (response.ok) { ready = true; break }
            } catch {}
            await setTimeout(200)
          }
          if (!ready) throw new Error('Local test server did not become ready')
          JS
          npm run test:learning-shell
          npm run test:operations
          npm run test:module-covers
          npm run test:learn-home
          npm run test:reader-layout
