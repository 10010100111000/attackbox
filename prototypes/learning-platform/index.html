<main id="app"></main><div id="toast" role="status"></div>
<script>
const chapters=[
 {title:'认识终端与 Shell',time:8,summary:'从第一条命令开始，理解你与 Linux 对话的方式。',heading:'终端和 Shell 有什么不同？',text:'终端是输入命令、查看结果的窗口。Shell 是理解这些命令并执行操作的程序。你打开终端后，通常会进入一个 Shell 会话；本课程以 Bash 为例。',heading2:'读懂你的第一条命令',text2:'pwd 是 print working directory 的缩写。它会显示你当前所在目录的绝对路径。命令执行完成后，提示符重新出现，表示 Shell 正在等待你的下一次输入。',code:'<span class="comment"># 查看当前所在的目录</span>\n<span class="accent">pwd</span>\n/home/box\n\n<span class="comment"># 查看当前使用的 Shell</span>\n<span class="accent">echo $SHELL</span>\n/bin/bash',questions:[{q:'终端窗口与 Shell 的关系是？',options:['终端负责交互，Shell 解释并执行命令','二者完全相同，只是名称不同','Shell 仅用于显示命令结果'],correct:0,explanation:'终端提供输入和输出界面，Shell 负责解析与执行命令。'},{q:'想查看当前所在目录，应使用哪条命令？',options:['ls','pwd','clear'],correct:1,explanation:'pwd 显示当前工作目录；ls 列出目录内容。'}]},
 {title:'文件与目录导航',time:12,summary:'掌握 pwd、ls 和 cd，在文件系统中找到方向。',heading:'文件系统是一棵树',text:'Linux 使用从根目录 / 开始的树形结构组织文件。绝对路径从 / 开始，相对路径则从当前目录开始。你的位置决定了相对路径如何被解释。',heading2:'进入目录与返回上一级',text2:'使用 ls 查看当前目录的内容，使用 cd 切换目录。两个点 .. 表示上一级目录，单个点 . 表示当前目录。',code:'<span class="accent">pwd</span>\n/home/box\n\n<span class="comment"># 查看当前目录并进入 Documents</span>\n<span class="accent">ls</span>\nDocuments  Downloads\n<span class="accent">cd Documents</span>\n\n<span class="comment"># 返回上一级目录</span>\n<span class="accent">cd ..</span>',questions:[{q:'从任何目录访问 /home/box，使用的是哪种路径？',options:['相对路径','临时路径','绝对路径'],correct:2,explanation:'以 / 开头的路径是绝对路径，不依赖当前目录。'},{q:'返回当前目录的上一级，应使用？',options:['cd ..','cd .','ls ..'],correct:0,explanation:'cd .. 切换到父目录；ls .. 只查看父目录内容。'}]},
 {title:'理解文件权限',time:15,summary:'读懂 rwx，理解用户、用户组与其他人的访问边界。',heading:'谁可以访问这个文件？',text:'Linux 文件权限分别作用于所有者、所属组和其他用户。每一组权限都由读取 r、写入 w、执行 x 构成。权限决定了允许进行哪些操作。',heading2:'查看和修改权限',text2:'ls -l 显示文件的详细信息。chmod u+x 为所有者增加执行权限，而不是给所有人开放全部权限。实际操作时应遵循最小权限原则。',code:'<span class="comment"># 查看脚本权限</span>\n<span class="accent">ls -l hello.sh</span>\n-rw-r--r-- 1 box box 42 Oct 22 hello.sh\n\n<span class="comment"># 允许所有者执行脚本</span>\n<span class="accent">chmod u+x hello.sh</span>\n<span class="accent">./hello.sh</span>',questions:[{q:'权限字符 x 代表什么？',options:['读取','删除','执行'],correct:2,explanation:'r 代表读取、w 代表写入、x 代表执行。'},{q:'仅给文件所有者增加执行权限，应使用？',options:['chmod 777 hello.sh','chmod u+x hello.sh','chmod a+w hello.sh'],correct:1,explanation:'u 表示所有者，+x 表示增加执行权限；不需要开放所有权限。'}]}
];

const app=document.getElementById('app');const pct=()=>Math.round(completed.length/3*100);const unlocked=i=>i===0||completed.includes(i-1);const current=()=>chapters.findIndex((_,i)=>!completed.includes(i))===-1?2:chapters.findIndex((_,i)=>!completed.includes(i));

function modules(){app.innerHTML=`<div class="container"><div class="eyebrow">YOUR NEXT CHAPTER STARTS HERE</div><h1>让知识，成为你的能力。</h1><p>沿着清晰的学习路线，阅读、思考，再迈出下一步。</p><section class="continue"><div><div class="eyebrow">${completed.length?'CONTINUE LEARNING':'RECOMMENDED FIRST STEP'}</div><h2>Linux 基础入门</h2><p>${completed.length?'接着上一次的进度，继续探索 Linux。':'从终端到文件权限，建立扎实的命令行基础。'}</p><div class="progress"><i style="width:${pct()}%"></i></div><div class="small muted" style="margin-top:9px">${completed.length} / 3 章节已完成 · 按自己的节奏学习</div></div><a class="btn" href="${completed.length?'#lesson/'+current():'#roadmap'}">${completed.length?'继续学习':'查看模块'} <span>↗</span></a></section><div class="flex between toolbar"><div class="filters">${['全部模块','基础入门','Web 安全','网络基础'].map(c=>`<button class="filter ${category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}</div><input class="search" id="search" type="search" placeholder="搜索学习模块…" aria-label="搜索学习模块" value=""></div><div class="cards" id="cards"></div><div class="footer">LEARN WITH INTENTION. BUILD WITH CONFIDENCE.</div></div>`;document.getElementById('search').value=search;document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;modules()});document.getElementById('search').oninput=e=>{search=e.target.value;cards()};cards()}
function cards(){const items=[{title:'Linux 基础入门',desc:'认识终端，掌握文件操作，理解 Linux 权限。',category:'基础入门',n:'3 章节',art:'>_',color:'',ready:true},{title:'Web 安全基础',desc:'理解 HTTP、身份认证与常见 Web 安全问题。',category:'Web 安全',n:'内容筹备中',art:'</>',color:'blue'},{title:'网络探索',desc:'从 IP 地址到协议，建立自己的网络知识地图。',category:'网络基础',n:'内容筹备中',art:'⌘',color:'sand'}].filter(x=>(category==='全部模块'||x.category===category)&&x.title.toLowerCase().includes(search.toLowerCase()));document.getElementById('cards').innerHTML=items.map(x=>`<${x.ready?'a href="#roadmap"':'div'} class="card"><div class="card-art ${x.color}"><span class="art-symbol">${x.art.replace('<','&lt;')}</span><span class="art-lines"><i></i><i></i><i style="width:60%"></i></span></div><div class="card-body"><span class="tag">${x.category}</span><h3>${x.title}</h3><p>${x.desc}</p><div class="card-meta"><span>${x.n}</span>${x.ready?'<span>约 35 分钟</span><span>含章节测验</span>':''}</div><div class="card-bottom"><span>${x.ready?(completed.length?`已完成 ${completed.length} / 3 章节`:'查看模块'):'即将上线'}</span><span>${x.ready?'↗':'—'}</span></div></div></${x.ready?'a':'div'}>`).join('')||'<div class="empty">没有匹配的模块，试试其他关键词。</div>'}
function roadmap(){app.innerHTML=`<div class="container"><div class="crumb"><a href="#modules">学习空间</a> / Linux 基础入门</div><section class="hero"><div><span class="tag">基础入门</span> <span class="tag">章节测验</span><h1>Linux 基础入门</h1><p>从第一条命令开始，理解文件系统与权限。通过三个循序渐进的章节，建立使用 Linux 的信心。</p><div class="stats"><span>◷ 约 35 分钟</span><span>▤ 3 个章节</span><span>◎ 无需前置经验</span></div><div class="flex small"><span style="color:var(--green)">✓</span> 阅读教程 → 通过测验 → 解锁下一章</div></div><aside class="summary"><div class="eyebrow">YOUR LEARNING PATH</div><div class="flex between" style="margin:16px 0 12px"><strong>学习进度</strong><span class="muted small">${pct()}%</span></div><div class="progress"><i style="width:${pct()}%"></i></div><p class="small" style="margin:10px 0 0">已完成 ${completed.length} / 3 个章节</p><a href="#lesson/${current()}" class="btn">${completed.length===3?'回顾本模块':completed.length?'继续学习':'开始学习'} →</a></aside></section><div class="road-layout"><section><div class="flex between" style="margin-bottom:17px"><h2 style="margin:0;font-size:19px">你的学习路线</h2><span class="muted small">循序渐进，一次一步</span></div><div class="road">${chapters.map((c,i)=>`<div class="road-item ${unlocked(i)?'':'locked'}"><div class="step ${completed.includes(i)?'done':unlocked(i)?'current':''}">${icon(i)}</div><div><h3>${c.title}</h3><p>${c.time} 分钟 · 2 道测验</p></div>${unlocked(i)?`<a class="right" style="color:var(--green)" href="#lesson/${i}">${completed.includes(i)?'回顾':'进入学习'} →</a>`:'<span class="right">待解锁</span>'}</div>`).join('')}</div></section><aside class="aside-note"><h3>学完后，你将能够</h3><p>✓ 理解终端与 Shell 的关系<br>✓ 在 Linux 文件系统中自如导航<br>✓ 查看并正确调整文件权限</p><h3 style="margin-top:25px">关于章节测验</h3><p>每章两道题，全部答对即可继续。答错会得到解释，可以随时重试。已完成的章节始终可以回顾。</p></aside></div></div>`}
function lesson(i){if(!chapters[i]||!unlocked(i)){location.hash='roadmap';notify('先完成前一章节的测验，即可解锁');return}const c=chapters[i];app.innerHTML=`<div class="learn-shell"><aside class="sidebar" id="sidebar"><a class="back" href="#roadmap">← 返回学习路线</a><div class="eyebrow">LINUX ESSENTIALS</div><h3>Linux 基础入门</h3><div class="flex between small muted"><span>${completed.length} / 3 章节已完成</span><span>${pct()}%</span></div><div class="progress"><i style="width:${pct()}%"></i></div><div class="side-label">模块目录</div>${chapters.map((x,n)=>`<button class="chapter ${n===i?'selected':''}" ${unlocked(n)?'':'disabled'} data-chapter="${n}"><span class="mini">${icon(n)}</span><span>${x.title}</span></button>`).join('')}<div class="side-note">通过当前章节测验后，<br>即可解锁下一章节。<br><br>✓ 原型中的进度保存在此浏览器</div></aside><section class="reading"><div class="reading-top"><span><button class="mobile-menu" id="menu" aria-label="切换章节目录">☰ 目录</button>基础入门 / Linux 基础入门</span><span>第 ${i+1} / 3 章 · 约 ${c.time} 分钟</span></div><div class="article-grid"><article class="article"><div class="eyebrow">CHAPTER ${String(i+1).padStart(2,'0')}</div><h1>${c.title}</h1><p class="lead">${c.summary}</p><div class="callout"><strong>本章学习目标</strong><p>理解核心概念，读懂示例命令，并通过两道小测验确认你的掌握程度。</p></div><h2 id="concept">${c.heading}</h2><p>${c.text}</p><h2 id="commands">${c.heading2}</h2><p>${c.text2}</p><div class="code"><div class="code-top"><span>BASH · 命令示例</span><button class="copy" id="copy">复制命令</button></div><pre>${c.code}</pre></div><div class="callout"><strong>停下来，想一想</strong><p>先用自己的话解释每条命令的作用，再进入测验。不需要记住所有命令，理解它们解决什么问题更重要。</p></div><form class="quiz" id="quiz"><div class="flex between"><span class="eyebrow">CHECK YOUR UNDERSTANDING</span><span class="tag">${completed.includes(i)?'✓ 已通过':'2 道题 · 可重试'}</span></div><h2>检验一下，学会了吗？</h2><p class="quiz-intro">全部答对即可解锁下一章节。答错也没关系，解释会帮你找到思路。</p>${c.questions.map((q,n)=>`<div class="question"><h3>${n+1}. ${q.q}</h3>${q.options.map((o,k)=>`<label class="option"><input type="radio" name="q${n}" value="${k}" required><span>${o}</span></label>`).join('')}</div>`).join('')}<div id="feedback" aria-live="polite"></div><div class="quiz-footer"><span class="muted small">${completed.includes(i)?'已完成，可以再次答题巩固知识':'完成两道题后提交答案'}</span><button class="btn" type="submit">提交答案 →</button></div></form><div class="next-row">${i>0?`<a class="btn text" href="#lesson/${i-1}">← 上一章</a>`:'<a class="btn text" href="#roadmap">← 学习路线</a>'}${i<2?`<button id="next" class="btn secondary" ${completed.includes(i)?'':'disabled'}>${completed.includes(i)?'下一章：'+chapters[i+1].title+' →':'通过测验后，解锁下一章 ⌑'}</button>`:`<a href="#roadmap" class="btn secondary">返回模块概览 →</a>`}</div></article><aside class="toc"><strong>本章内容</strong><a href="#concept" data-scroll="concept">${c.heading}</a><a href="#commands" data-scroll="commands">${c.heading2}</a><a href="#quiz" data-scroll="quiz">章节测验</a><div style="margin-top:25px;color:var(--muted);font-size:10px">阅读 · 理解 · 验证</div></aside></div></section></div>`;document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>location.hash='lesson/'+b.dataset.chapter);document.querySelectorAll('[data-scroll]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.scroll).scrollIntoView({behavior:'smooth'})});document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('copy').onclick=async()=>{const temp=document.createElement('div');temp.innerHTML=c.code;const commands=temp.textContent.split('\n').filter(l=>l.startsWith('pwd')||l.startsWith('echo ')||l==='ls'||l.startsWith('ls ')||l.startsWith('cd ')||l.startsWith('chmod ')||l.startsWith('./')).join('\n');try{await navigator.clipboard.writeText(commands);notify('命令已复制')}catch{notify('浏览器不允许复制，请手动选择命令')}};if(i<2)document.getElementById('next').onclick=()=>{if(completed.includes(i))location.hash='lesson/'+(i+1)};document.getElementById('quiz').onsubmit=e=>{e.preventDefault();const form=new FormData(e.target);const wrong=c.questions.map((q,n)=>Number(form.get('q'+n))===q.correct?null:n).filter(n=>n!==null);const f=document.getElementById('feedback');if(wrong.length){f.className='feedback error';f.innerHTML=`<strong>答对 ${2-wrong.length} / 2 题，再试一次。</strong><br>`+wrong.map(n=>`第 ${n+1} 题：${c.questions[n].explanation}`).join('<br>');return}if(!completed.includes(i))completed.push(i);try{localStorage.setItem('attackbox-learning-prototype-v1',JSON.stringify(completed))}catch{}lesson(i);const result=document.getElementById('feedback');result.className='feedback';result.innerHTML=`<strong>✓ 2 / 2 全部正确！${i<2?'下一章节已解锁。':'你已完成 Linux 基础入门！'}</strong><br>${i<2?'准备好后，点击下方按钮继续；也可以留在这里回顾。':'返回模块概览，查看你的完整学习进度。'}`;document.getElementById('quiz').scrollIntoView({behavior:'smooth',block:'start'});notify(i<2?'测验通过，下一章已解锁':'恭喜，模块学习已完成！')}}

function modules(){app.innerHTML=`<div class="container"><div class="list-head"><h1>学习</h1><p>选择一个模块开始，或沿着学习路线循序渐进。</p></div>${tabs('modules')}<div class="flex between toolbar"><div class="filters">${['全部模块','基础入门','Web 安全','网络基础'].map(c=>`<button class="filter ${category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}</div><input class="search" id="search" type="search" placeholder="搜索模块" aria-label="搜索模块"></div><div class="cards" id="cards"></div></div>`;document.getElementById('search').value=search;document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;modules()});document.getElementById('search').oninput=e=>{search=e.target.value;cards()};cards()}

function path(){app.innerHTML=`<div class="container"><div class="detail"><div class="crumb"><a href="#paths">学习路线</a> / Linux 与安全基础</div><section class="detail-top"><h1>Linux 与安全基础</h1><p class="detail-intro">从命令行操作到网络协议，再进入 Web 安全。按顺序完成三个模块，建立自己的基础知识体系。</p><div class="detail-meta">3 个模块 · 入门</div><a class="btn" href="#roadmap">${completed.length?'继续学习':'开始学习'} →</a></section><div class="outline-head"><h2>路线中的模块</h2><span>${completed.length===3?'1':'0'} / 3 已完成</span></div><div class="outline-list"><a class="outline-row" href="#roadmap"><span class="number">01</span><div><h3>Linux 入门</h3><p>终端、目录导航与文件权限 · 3 章节</p></div><span class="status current">${completed.length===3?'已完成':completed.length?'学习中':'从这里开始'}</span><span class="row-arrow">→</span></a><a class="outline-row" href="#module/network"><span class="number">02</span><div><h3>网络基础</h3><p>理解地址、端口与网络协议 · 3 章节</p></div><span class="status">未开始</span><span class="row-arrow">→</span></a><a class="outline-row" href="#module/web"><span class="number">03</span><div><h3>Web 安全基础</h3><p>HTTP、身份认证与输入安全 · 3 章节</p></div><span class="status">未开始</span><span class="row-arrow">→</span></a></div></div></div>`}
function roadmap(type='linux'){const linux=type==='linux';const title=linux?'Linux 入门':type==='network'?'网络基础':'Web 安全基础';const list=linux?chapters:type==='network'?[{title:'地址与子网',time:12},{title:'端口与连接',time:10},{title:'理解 TCP 与 DNS',time:15}]:[{title:'HTTP 请求与响应',time:12},{title:'身份认证与会话',time:15},{title:'输入与信任边界',time:15}];app.innerHTML=`<div class="container"><div class="detail"><div class="crumb"><a href="#modules">学习模块</a> / ${title}</div><section class="detail-top"><h1>${title}</h1><p class="detail-intro">${linux?'从终端与 Shell 开始，掌握目录导航和文件权限。每章包含简短测验，通过后进入下一章。':type==='network'?'理解地址、端口与常用协议，为进一步的网络学习打好基础。':'从请求与响应出发，理解 Web 应用中的身份、会话与信任边界。'}</p><div class="detail-meta">入门 · 3 章节 · ${linux?'约 35 分钟':'内容示例'}</div>${linux?`<a class="btn" href="#lesson/${current()}">${completed.length===3?'回顾模块':completed.length?'继续学习':'开始学习'} →</a>`:'<button class="btn secondary" disabled>章节内容待补充</button>'}</section><div class="outline-head"><h2>章节大纲</h2><span>${linux?completed.length:0} / 3 已完成</span></div><div class="outline-list">${list.map((c,i)=>`<${linux&&unlocked(i)?`a href="#lesson/${i}"`:'div'} class="outline-row"><span class="number">${linux&&completed.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><div><h3>${c.title}</h3><p>${c.time} 分钟 · 章节测验</p></div><span class="status ${linux&&unlocked(i)?'current':''}">${!linux?'待补充':completed.includes(i)?'已完成':unlocked(i)?'可学习':'待解锁'}</span>${linux&&unlocked(i)?'<span class="row-arrow">→</span>':''}</${linux&&unlocked(i)?'a':'div'}>`).join('')}</div><p class="route-label">所属路线：<a href="#path" style="text-decoration:underline;text-underline-offset:3px">Linux 与安全基础</a></p></div></div>`}
const originalCards=cards;
cards=function(){originalCards();const nodes=document.querySelectorAll('.card');nodes.forEach(c=>{if(c.tagName==='A')return;const title=c.querySelector('h3')?.textContent;const href=title==='网络探索'?'#module/network':'#module/web';const a=document.createElement('a');a.href=href;a.className=c.className;a.innerHTML=c.innerHTML.replace('即将上线','查看模块').replace('内容筹备中','3 章节');a.querySelector('.card-bottom span:last-child').textContent='↗';c.replaceWith(a)});};
const originalLesson=lesson;
lesson=function(i){originalLesson(i);const intro=document.querySelector('.quiz-intro');if(intro)intro.textContent='两道题全部答对，即可继续下一章。';const code=document.querySelector('.code-top span');if(code)code.textContent='bash';};
function render(){const h=location.hash.slice(1);if(h.startsWith('lesson/'))lesson(Number(h.split('/')[1]));else if(h==='path')path();else if(h==='paths')paths();else if(h.startsWith('module/'))roadmap(h.split('/')[1]);else if(h==='roadmap')roadmap();else modules();window.scrollTo(0,0)}

window.addEventListener('hashchange',render);render();
</script>

<script>

const featureSlides=[
 {label:'本期精选',title:'从理解原理，到独立解决问题。',description:'先建立基础，再进入靶场。挑选适合自己的起点，按自己的节奏探索。',cta:'探索入门路线',href:'#path',command:'$ start learning',caption:'read → practice → understand'},
 {label:'动手挑战',title:'把刚学会的知识，带进靶场。',description:'从 Linux 权限到 Web 安全，在独立的练习环境中验证你的理解。',cta:'浏览挑战',href:'#challenges',command:'$ enter challenge',caption:'explore → test → discover'},
 {label:'模块推荐',title:'从第一条 Linux 命令开始。',description:'认识 Shell、探索目录、理解权限，用三个章节打好命令行基础。',cta:'查看 Linux 入门',href:'#roadmap',command:'$ pwd',caption:'/home/box'}
];
let carouselIndex=0,carouselTimer=null,carouselPaused=matchMedia('(prefers-reduced-motion: reduce)').matches,carouselHover=false,carouselFocus=false;
function slideCopy(s){return `<div class="feature-label">${s.label}</div><h1>${s.title}</h1><p>${s.description}</p><a href="${s.href}" class="btn">${s.cta} →</a>`}
function slideArt(s){return `<div class="terminal-art"><div class="dots"><i></i><i></i><i></i></div><div class="cmd">${s.command}</div><div class="dim">${s.caption}</div><div style="margin-top:5px">▍</div></div>`}
const featureBanner=()=>`<section class="feature-banner feature-carousel" id="feature-carousel" aria-roledescription="轮播" aria-label="推荐内容"><div class="carousel-copy" id="carousel-copy">${slideCopy(featureSlides[carouselIndex])}</div><div class="banner-art" id="carousel-art" aria-hidden="true">${slideArt(featureSlides[carouselIndex])}</div><div class="carousel-pagination" aria-label="选择推荐内容">${featureSlides.map((s,i)=>`<button class="carousel-dot ${carouselIndex===i?'active':''}" data-slide="${i}" aria-label="第 ${i+1} 项：${s.label}" ${i===carouselIndex?'aria-current="true"':''}><span></span></button>`).join('')}</div><div class="carousel-controls"><span class="carousel-count" id="carousel-count">${carouselIndex+1} / ${featureSlides.length}</span><button class="carousel-control" id="carousel-pause" aria-label="${carouselPaused?'开启自动轮播':'暂停自动轮播'}" title="${carouselPaused?'开启自动轮播':'暂停自动轮播'}">${carouselPaused?'▷':'Ⅱ'}</button><button class="carousel-control" id="carousel-prev" aria-label="上一项">‹</button><button class="carousel-control" id="carousel-next" aria-label="下一项">›</button></div><span class="carousel-announcement" id="carousel-announcement" aria-live="polite"></span></section>`;
function stopCarousel(){if(carouselTimer!==null)clearTimeout(carouselTimer);carouselTimer=null}
function scheduleCarousel(){stopCarousel();if(carouselPaused||carouselHover||carouselFocus||document.hidden||!document.getElementById('feature-carousel'))return;carouselTimer=setTimeout(()=>{carouselTimer=null;changeCarousel(1,false)},6000)}
function changeCarousel(delta,manual=true,target=null){const root=document.getElementById('feature-carousel');if(!root){stopCarousel();return}carouselIndex=target===null?(carouselIndex+delta+featureSlides.length)%featureSlides.length:target;const s=featureSlides[carouselIndex];document.getElementById('carousel-copy').innerHTML=slideCopy(s);document.getElementById('carousel-art').innerHTML=slideArt(s);document.getElementById('carousel-count').textContent=`${carouselIndex+1} / ${featureSlides.length}`;root.querySelectorAll('[data-slide]').forEach(b=>{const current=Number(b.dataset.slide)===carouselIndex;b.classList.toggle('active',current);if(current)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});if(manual)document.getElementById('carousel-announcement').textContent=`${carouselIndex+1} / ${featureSlides.length}：${s.label}`;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.getElementById('carousel-copy').animate([{opacity:.4,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'ease-out'});scheduleCarousel()}
function mountCarousel(){stopCarousel();const root=document.getElementById('feature-carousel');if(!root)return;carouselHover=root.matches(':hover')&&matchMedia('(hover: hover)').matches;carouselFocus=root.contains(document.activeElement);root.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){carouselHover=true;stopCarousel()}});root.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){carouselHover=false;scheduleCarousel()}});root.addEventListener('focusin',()=>{carouselFocus=true;stopCarousel()});root.addEventListener('focusout',()=>{queueMicrotask(()=>{carouselFocus=root.contains(document.activeElement);scheduleCarousel()})});document.getElementById('carousel-prev').onclick=()=>changeCarousel(-1);document.getElementById('carousel-next').onclick=()=>changeCarousel(1);root.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>changeCarousel(0,true,Number(b.dataset.slide)));document.getElementById('carousel-pause').onclick=e=>{carouselPaused=!carouselPaused;e.currentTarget.textContent=carouselPaused?'▷':'Ⅱ';const label=carouselPaused?'开启自动轮播':'暂停自动轮播';e.currentTarget.setAttribute('aria-label',label);e.currentTarget.title=label;scheduleCarousel()};root.addEventListener('keydown',e=>{if(e.target.closest('a'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();changeCarousel(e.key==='ArrowRight'?1:-1)}});let touchStart=null;root.addEventListener('touchstart',e=>{if(e.touches.length===1){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};stopCarousel()}},{passive:true});root.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.4)changeCarousel(dx<0?1:-1);else scheduleCarousel()},{passive:true});root.addEventListener('touchcancel',()=>{touchStart=null;scheduleCarousel()},{passive:true});scheduleCarousel()}

returnOutlineState();bindReadChapters();document.getElementById('outline-toggle').onclick=toggleOutline;document.getElementById('outline-shade').onclick=()=>{document.getElementById('read-layout').classList.remove('outline-open');document.getElementById('outline-toggle').setAttribute('aria-expanded','false')};document.querySelectorAll('[data-open-lab]').forEach(b=>b.onclick=()=>openLab(b.dataset.openLab));if(i<2)document.getElementById('read-next').onclick=()=>{if(completed.includes(i))location.hash='lesson/'+(i+1)};

document.getElementById('answer-quiz').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target);let correct=0;inputQuizzes[i].forEach((q,n)=>{const ok=[q.answer,...(q.aliases||[])].some(a=>normalizeAnswer(a)===normalizeAnswer(data.get('answer'+n)));const input=document.getElementById('answer-'+n),feedback=document.getElementById('answer-feedback-'+n);input.setAttribute('aria-invalid',String(!ok));input.classList.toggle('valid',ok);feedback.className='answer-feedback '+(ok?'correct':'error');feedback.textContent=ok?'✓ 答案正确':'再想一想：'+q.hint;if(ok)correct++});const result=document.getElementById('answer-result');result.className='feedback '+(correct===2?'':'error');if(correct<2){result.textContent=`已答对 ${correct} / 2 题。修改答案后可再次校验。`;return}if(!completed.includes(i))completed.push(i);try{localStorage.setItem('attackbox-learning-prototype-v1',JSON.stringify(completed))}catch{}result.textContent=i<2?'✓ 全部正确，下一章已解锁。':'✓ 全部正确，你已完成本模块。';document.querySelector('#answer-quiz .tag').textContent='✓ 已通过';document.getElementById('sidebar-host').innerHTML=readingSidebar(i);bindReadChapters();if(i<2){const next=document.getElementById('read-next');next.disabled=false;next.textContent='下一章：'+chapters[i+1].title+' →'}};drawLab()};
function bindReadChapters(){document.querySelectorAll('[data-read-chapter]').forEach(b=>b.onclick=()=>{location.hash='lesson/'+b.dataset.readChapter})}
function openLab(mode){labMode=mode;labVisible=true;labMinimized=false;if(mode==='gui'&&dockHeight<360)dockHeight=390;drawLab()}
function updateEnvToolbar(){document.querySelectorAll('[data-open-lab]').forEach(b=>b.classList.toggle('selected',labVisible&&!labMinimized&&b.dataset.openLab===labMode));const status=document.querySelector('.environment-label');if(status)status.innerHTML=`<span class="environment-dot ${labStarted?'running':''}"></span>${labStarted?'环境运行中 · 演示':'环境未启动'}`}
function drawLab(){const host=document.getElementById('lab-host'),layout=document.getElementById('read-layout');if(!host||!layout)return;layout.style.setProperty('--dock-height',dockHeight+'px');layout.classList.toggle('dock-open',labVisible&&!labMinimized&&!labExpanded);updateEnvToolbar();if(!labVisible){host.innerHTML='';return}if(labMinimized){host.innerHTML=`<button class="dock-minimized" id="restore-lab">${labMode==='cli'?'›_ CLI 终端':'▣ GUI 桌面'} · 展开 ↑</button>`;document.getElementById('restore-lab').onclick=()=>{labMinimized=false;drawLab()};return}host.innerHTML=`<section class="lab-dock ${labExpanded?'expanded':''}" aria-label="练习环境面板"><div class="dock-grip" id="dock-grip" role="separator" aria-label="调整练习面板高度" aria-orientation="horizontal" aria-valuemin="220" aria-valuemax="${Math.max(220,innerHeight-155)}" aria-valuenow="${dockHeight}" tabindex="0"></div><div class="dock-header"><div class="dock-title">${labMode==='cli'?'›_ 终端':'▣ 桌面'}</div><div class="dock-actions"><span class="dock-hint">交互演示 · 未连接真实环境</span><button id="expand-lab" aria-label="${labExpanded?'还原面板':'展开练习面板'}" title="${labExpanded?'还原':'展开'}">${labExpanded?'⊡':'⛶'}</button><button id="minimize-lab" aria-label="收起练习面板" title="收起，保留环境">—</button><button id="close-lab" aria-label="关闭练习面板" title="关闭面板，保留环境">×</button></div></div><div class="dock-body">${!labStarted?`<div class="dock-empty"><div><h3>启动一个练习环境</h3><p>CLI 与 GUI 共用同一个实例。本原型仅演示布局。</p></div><button class="btn" id="start-lab">模拟启动</button></div>`:labMode==='cli'?`<div class="terminal-view"><div class="terminal-caption">演示终端 · 可试输入 pwd、ls、echo $SHELL、clear；不会执行真实命令。</div><div id="terminal-output"></div><form id="terminal-form" class="terminal-line"><span class="terminal-prompt">box@attackbox:~$</span><input class="terminal-input" id="terminal-input" aria-label="演示终端命令" autocomplete="off" autocapitalize="off" spellcheck="false"></form></div>`:`<div class="gui-stage"><div class="gui-menubar"><span>应用程序　 位置</span><span>AttackBox · 演示桌面</span></div><div class="gui-center"><div class="gui-window"><div class="gui-window-title">文件管理器</div><div class="gui-folders"><div><span class="folder-icon">▰</span>Documents</div><div><span class="folder-icon">▰</span>Downloads</div><div><span class="folder-icon">▰</span>Desktop</div></div></div><div class="gui-note">桌面布局占位 · 后续接入实际 noVNC 画面</div></div></div>`}</div></section>`;
document.querySelectorAll('[data-dock-mode]').forEach(b=>b.onclick=()=>{labMode=b.dataset.dockMode;drawLab()});document.getElementById('expand-lab').onclick=()=>{labExpanded=!labExpanded;drawLab()};document.getElementById('minimize-lab').onclick=()=>{labMinimized=true;labExpanded=false;drawLab()};document.getElementById('close-lab').onclick=()=>{labVisible=false;labExpanded=false;drawLab()};const start=document.getElementById('start-lab');if(start)start.onclick=()=>{labStarted=true;drawLab()};const form=document.getElementById('terminal-form');if(form)form.onsubmit=e=>{e.preventDefault();const input=document.getElementById('terminal-input'),cmd=input.value.trim(),out=document.getElementById('terminal-output');if(!cmd)return;if(cmd==='clear'){out.textContent='';input.value='';return}const line=document.createElement('div');line.className='terminal-output';const outputs={'pwd':'/home/box','ls':'Documents  Downloads  Desktop','echo $SHELL':'/bin/bash','whoami':'box'};line.textContent='box@attackbox:~$ '+cmd+'\n'+(outputs[cmd]||'这是布局演示，命令不会真实执行。');out.appendChild(line);input.value='';document.querySelector('.dock-body').scrollTop=document.querySelector('.dock-body').scrollHeight};const grip=document.getElementById('dock-grip');function setHeight(h){dockHeight=Math.max(220,Math.min(innerHeight-155,h));layout.style.setProperty('--dock-height',dockHeight+'px');grip.setAttribute('aria-valuenow',String(dockHeight))}grip.onpointerdown=e=>{if(labExpanded)return;const startY=e.clientY,initial=dockHeight;grip.setPointerCapture(e.pointerId);grip.onpointermove=ev=>setHeight(initial+startY-ev.clientY);grip.onpointerup=()=>{grip.onpointermove=null}};grip.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();setHeight(dockHeight+(e.key==='ArrowUp'?20:-20))}}}
if(!location.hash)history.replaceState(null,'',location.pathname+location.search+'#modules');render();
</script>
<script>
const beforeCompactQuiz=lesson;
lesson=function(i){beforeCompactQuiz(i);const form=document.getElementById('answer-quiz');if(!form)return;const solved=new Set();const wasCompleted=completed.includes(i);
form.innerHTML=`<div class="flex between"><h2>章节练习</h2><span class="tag" id="check-progress">${wasCompleted?'已完成 · 可重新练习':'0 / 2 已通过'}</span></div>${inputQuizzes[i].map((q,n)=>`<div class="answer-question"><label for="answer-${n}">${n+1}. ${q.label}</label><div class="answer-line"><input class="answer-input" id="answer-${n}" name="answer${n}" placeholder="${q.placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="answer-feedback-${n}"><button class="answer-check" type="button" data-check="${n}">校验</button></div><span class="answer-feedback" id="answer-feedback-${n}" aria-live="polite"></span></div>`).join('')}`;
form.onsubmit=e=>e.preventDefault();const next=document.getElementById('read-next');if(next&&!wasCompleted)next.textContent='完成练习后继续';
function updateCompletion(){document.getElementById('check-progress').textContent=solved.size===2?'2 / 2 已通过':wasCompleted?'已完成 · 可重新练习':`${solved.size} / 2 已通过`;if(solved.size!==2)return;if(!completed.includes(i))completed.push(i);try{localStorage.setItem('attackbox-learning-prototype-v1',JSON.stringify(completed))}catch{}document.getElementById('sidebar-host').innerHTML=readingSidebar(i);bindReadChapters();if(next){next.disabled=false;next.textContent='下一章：'+chapters[i+1].title+' →'}else document.getElementById('check-progress').textContent='本模块已完成'}
function validate(n){const q=inputQuizzes[i][n],input=document.getElementById('answer-'+n),feedback=document.getElementById('answer-feedback-'+n),button=form.querySelector(`[data-check="${n}"]`);if(!input.value.trim()){feedback.textContent='请先输入答案';feedback.className='answer-feedback';input.focus();return}const ok=[q.answer,...(q.aliases||[])].some(a=>normalizeAnswer(a)===normalizeAnswer(input.value));input.setAttribute('aria-invalid',String(!ok));input.classList.toggle('valid',ok);button.classList.toggle('correct',ok);button.textContent=ok?'✓ 已通过':'重试';feedback.className='answer-feedback '+(ok?'correct':'error');feedback.textContent=ok?'':'提示：'+q.hint;if(ok)solved.add(n);else solved.delete(n);updateCompletion()}
form.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>validate(Number(b.dataset.check)));inputQuizzes[i].forEach((q,n)=>{const input=document.getElementById('answer-'+n);input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();validate(n)}};input.oninput=()=>{solved.delete(n);const b=form.querySelector(`[data-check="${n}"]`);b.textContent='校验';b.classList.remove('correct');input.classList.remove('valid');input.removeAttribute('aria-invalid');document.getElementById('answer-feedback-'+n).textContent='';updateCompletion()}})
};
render();
</script>
<script>
const beforeAlignedExercises=lesson;
lesson=function(i){beforeAlignedExercises(i);const progress=document.getElementById('check-progress');if(progress){progress.setAttribute('role','status');progress.setAttribute('aria-live','polite');progress.style.cssText='position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;display:block;border:0'}document.querySelectorAll('.answer-question').forEach((question,n)=>{const q=inputQuizzes[i]?.[n];if(q&&q.answer.length<12)question.querySelector('.answer-line').classList.add('short-answer')})};
render();
</script>
