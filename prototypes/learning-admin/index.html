ration-detail{grid-template-columns:1fr}.integration-state-card{max-width:none}.integration-state-card .btn{width:auto;margin-right:8px}.integration-detail .field-row{gap:0}}@media(max-width:760px){.scene-picks{gap:15px}.integration-demo{padding:11px 13px;font-size:10px}.domain-facts{grid-template-columns:1fr}.integration-state-card{padding:19px}.integration-card .integration-state{margin-bottom:18px}.integration-state-card .btn{width:100%}.integration-list{gap:15px}}
</style></head><body><div class="shell"><aside class="sidebar"><a href="#modules" class="brand"><b>a›</b>AttackBox</a><nav><div class="nav-label">内容管理</div><a class="nav-link" data-nav="overview" href="#overview"><span class="nav-icon">◷</span>平台概览</a><a class="nav-link" data-nav="modules" href="#modules"><span class="nav-icon">▤</span>学习模块</a><a class="nav-link" data-nav="routes" href="#routes"><span class="nav-icon">↳</span>学习路线</a><a class="nav-link" data-nav="homepage" href="#homepage"><span class="nav-icon">▧</span>首页管理</a><div class="nav-label users-nav-label">账户管理</div><a class="nav-link" data-nav="users" href="#users"><span class="nav-icon">♙</span>用户管理</a><div class="nav-label users-nav-label">环境管理</div><a class="nav-link" data-nav="nodes" href="#nodes"><span class="nav-icon">▦</span>节点管理</a><a class="nav-link" data-nav="instances" href="#instances"><span class="nav-icon">▣</span>运行实例</a><div class="nav-label users-nav-label">系统管理</div><a class="nav-link" data-nav="control" href="#control"><span class="nav-icon">⚙</span>系统设置</a></nav><div class="sidebar-bottom"><a href="../learning-platform/index.html">↗ 用户端原型</a><span>管理界面原型 · 本地演示</span></div></aside><div><header class="topbar"><div class="crumb" id="crumb">内容管理 / 学习模块</div><details class="user" id="user"><summary aria-label="管理员菜单"><span class="avatar">AD</span>⌄</summary><div class="user-pop"><strong class="small">管理员</strong><div class="tiny muted" style="margin:7px 0 13px">外观</div><div class="theme-switch"><button data-theme="light">☀ 石墨</button><button data-theme="dark">☾ 深海</button></div></div></details></header><div id="storage-notice" role="status"></div><main id="app" class="content"></main></div></div><div id="toast" role="status"></div>
<script>
const clone=o=>JSON.parse(JSON.stringify(o));const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const source=n=>'https://github.com/example/learning/blob/main/'+n+'.md';
const newChapter=(title='新章节')=>({id:uid(),title,source:'',minutes:10,body:'# '+title+'\n\n在这里编写 Markdown 正文。',questions:[]});
const shellChapter={id:'shell',title:'认识终端与 Shell',source:source('linux/shell'),minutes:8,body:'# 认识终端与 Shell\n\n终端提供交互界面，Shell 负责理解并执行命令。\n\n## 查看当前目录\n\npwd 可以显示当前工作目录的绝对路径。\n\n```bash\npwd\n/home/box\n```\n\n## 查看当前 Shell\n\n运行 echo $SHELL，观察当前使用的 Shell。',questions:[{id:'q1',prompt:'查看当前工作目录，应该输入哪条命令？',answer:'pwd',hint:'它是 print working directory 的缩写。'},{id:'q2',prompt:'示例中 /bin/bash 对应的 Shell 名称是什么？',answer:'bash',hint:'输入程序名称。'}]};
function seed(){const modules=[{id:'linux',title:'Linux 入门',slug:'linux-basics',description:'从终端与 Shell 开始，掌握目录导航和文件权限。',category:'基础入门',access:'member',chapters:[clone(shellChapter),{...newChapter('文件与目录导航'),source:source('linux/navigation'),minutes:12},{...newChapter('理解文件权限'),source:source('linux/permissions'),minutes:15}],published:null},{id:'network',title:'网络基础',slug:'network-basics',description:'理解地址、端口与常用协议。',category:'网络基础',access:'public',chapters:[{...newChapter('地址与子网'),source:source('network/address')},{...newChapter('端口与连接'),source:source('network/ports')}],published:null},{id:'web',title:'Web 安全基础',slug:'web-basics',description:'从 HTTP 出发，理解身份认证与信任边界。',category:'Web 安全',access:'member',chapters:[{...newChapter('HTTP 请求与响应'),source:source('web/http')}],published:null}];modules[0].published=moduleSnapshot(modules[0]);modules[1].published=moduleSnapshot(modules[1]);return{modules,routes:[{id:'intro',title:'Linux 与安全基础',slug:'linux-security',description:'从命令行操作到网络协议，再进入 Web 安全。',moduleIds:['linux','network','web'],published:null}]}}
function moduleSnapshot(m){const {published,...rest}=m;return clone(rest)}function routeSnapshot(r){const {published,...rest}=r;return clone(rest)}
let state;try{state=JSON.parse(localStorage.getItem('attackbox-admin-prototype-v1'));if(!Array.isArray(state?.modules)||!Array.isArray(state?.routes))throw Error()}catch{state=seed()}
let unsaved=false,filter='全部',query='',moduleTab='chapters',editorTab='markdown',selectedChapter=null,dragItem=null;const app=document.getElementById('app');
function toast(text){const t=document.getElementById('toast');t.className='toast';t.textContent=text;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{t.textContent='';t.className=''},2600)}
function changed(){unsaved=true;document.querySelectorAll('[data-save-state]').forEach(e=>e.textContent='有未保存修改')}
function save(){try{localStorage.setItem('attackbox-admin-prototype-v1',JSON.stringify(state));unsaved=false;document.getElementById('storage-notice').innerHTML='';document.querySelectorAll('[data-save-state]').forEach(e=>e.textContent='草稿已保存');return true}catch{unsaved=true;document.getElementById('storage-notice').innerHTML='<div class="storage-warning">浏览器未允许本地保存。编辑仍可继续，但刷新后会丢失，请暂时保留此页面。</div>';document.querySelectorAll('[data-save-state]').forEach(e=>e.textContent='尚未持久保存');return false}}

function status(o,type='module'){if(!o.published)return'<span class="status">草稿</span>';const modified=JSON.stringify(type==='module'?moduleSnapshot(o):routeSnapshot(o))!==JSON.stringify(o.published);return'<span class="status live">已发布</span>'+(modified?' <span class="status">有草稿修改</span>':'')}
function validSlug(s){return /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(s)}function validSource(s){try{const u=new URL(s);return u.protocol==='https:'&&!u.username&&!u.password}catch{return false}}
function crumb(parts){document.getElementById('crumb').innerHTML=parts}
function moduleList(){crumb('内容管理 / 学习模块');app.innerHTML=`<div class="page-head"><div><h1>学习模块</h1><p>管理章节、Markdown 来源与章节练习。</p></div><button class="btn" id="new-module">＋ 新建模块</button></div><div class="filter-bar"><div class="filters">${['全部','已发布','草稿'].map(x=>`<button data-filter="${x}" class="filter ${filter===x?'active':''}">${x}</button>`).join('')}</div><input class="search" id="search" placeholder="搜索模块" aria-label="搜索模块"></div><div class="table-wrap"><table><thead><tr><th>模块</th><th>状态</th><th class="hide-mobile">章节</th><th class="hide-mobile">阅读权限</th><th></th></tr></thead><tbody id="module-rows"></tbody></table></div><p class="note">已发布模块的修改先保留为草稿，重新发布后才替换线上版本。</p>`;document.getElementById('new-module').onclick=createModule;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;moduleList()});document.getElementById('search').value=query;document.getElementById('search').oninput=e=>{query=e.target.value;moduleRows()};moduleRows()}
function moduleRows(){const rows=state.modules.filter(m=>(filter==='全部'||(filter==='已发布'?m.published:!m.published))&&m.title.toLowerCase().includes(query.toLowerCase()));document.getElementById('module-rows').innerHTML=rows.map(m=>`<tr><td><a href="#module/${m.id}"><strong>${esc(m.title)}</strong></a><p>${esc(m.category)} · /${esc(m.slug)}</p></td><td>${status(m)}</td><td class="hide-mobile muted">${m.chapters.length} 章节</td><td class="hide-mobile muted">${m.access==='public'?'公开全文':'登录阅读全文'}</td><td class="row-actions"><a href="#module/${m.id}">管理 →</a></td></tr>`).join('')||'<tr><td colspan="5" class="empty">没有匹配的模块</td></tr>'}

function generatedSlug(title){const english=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const base=english||'module-'+uid().replace(/[^a-z0-9]/g,'').slice(-7);let next=base,n=2;while(state.modules.some(m=>m.slug===next))next=base+'-'+n++;return next}
function createModule(){modal(`<h2>新建模块</h2><form id="create-module" novalidate><label class="field"><span class="field-label">模块名称</span><input name="title" required placeholder="例如：Linux 入门" maxlength="80" aria-describedby="create-title-error"><span class="field-error" id="create-title-error" aria-live="polite"></span></label><label class="field"><span class="field-label">访问标识</span><input name="slug" placeholder="自动生成，也可自行修改" aria-describedby="create-slug-error"><span class="field-help">用于页面地址，使用小写字母、数字和连字符。</span><span class="field-error" id="create-slug-error" aria-live="polite"></span></label><div class="modal-footer"><button class="btn secondary" type="button" data-close>取消</button><button class="btn" type="submit">创建并编辑</button></div></form>`);const form=document.getElementById('create-module'),title=form.elements.title,slug=form.elements.slug;form.onsubmit=e=>{e.preventDefault();form.querySelectorAll('.field-error').forEach(el=>el.textContent='');title.removeAttribute('aria-invalid');slug.removeAttribute('aria-invalid');const name=title.value.trim(),key=slug.value.trim()||generatedSlug(name);if(!name){document.getElementById('create-title-error').textContent='请输入模块名称。';title.setAttribute('aria-invalid','true');title.focus();return}if(!validSlug(key)||state.modules.some(m=>m.slug===key)){document.getElementById('create-slug-error').textContent=validSlug(key)?'该访问标识已被使用，请换一个。':'请使用小写字母、数字和连字符，例如 linux-basics。';slug.setAttribute('aria-invalid','true');slug.focus();return}const m={id:uid(),title:name,slug:key,description:'',category:'基础入门',access:'member',chapters:[],published:null};state.modules.unshift(m);changed();const persisted=save();closeModal();moduleTab='chapters';selectedChapter=null;location.hash='module/'+m.id;render();toast(persisted?'模块已创建，添加第一章即可开始':'模块已创建，当前浏览器无法保存，刷新前请保留页面')}}

function moduleEditor(id){const m=state.modules.find(x=>x.id===id);if(!m)return notFound();crumb(`<a href="#modules">学习模块</a> / ${esc(m.title)}`);app.innerHTML=`<div class="page-head"><div><div class="title-row"><h1 style="margin:0">${esc(m.title)}</h1>${status(m)}</div><p style="margin-top:7px">${m.chapters.length} 章节 · /learn/${esc(m.slug)}</p></div><div class="actions"><span class="save-state" data-save-state>${unsaved?'有未保存修改':'草稿已保存'}</span><button class="btn secondary" id="preview-module">预览</button><button class="btn secondary" id="save-module">保存草稿</button><button class="btn" id="publish-module">${m.published?'发布更新':'发布模块'}</button></div></div><div class="tabs"><button data-module-tab="chapters" class="${moduleTab==='chapters'?'active':''}">章节内容</button><button data-module-tab="basic" class="${moduleTab==='basic'?'active':''}">模块设置</button></div><div id="module-body"></div>`;document.querySelectorAll('[data-module-tab]').forEach(b=>b.onclick=()=>{moduleTab=b.dataset.moduleTab;moduleEditor(id)});document.getElementById('save-module').onclick=()=>{if(save())toast('草稿已保存，线上版本未改变')};document.getElementById('preview-module').onclick=()=>previewModule(m);document.getElementById('publish-module').onclick=()=>publishModule(m);if(moduleTab==='basic')moduleBasic(m);else chapterEditor(m)}
function moduleBasic(m){document.getElementById('module-body').innerHTML=`<div class="panel basic-form"><h2>基本信息</h2><label class="field"><span class="field-label">模块名称</span><input data-module-field="title" value="${esc(m.title)}" maxlength="80"></label><div class="field-row"><label class="field"><span class="field-label">访问标识</span><input data-module-field="slug" value="${esc(m.slug)}"><span class="field-help">用于页面地址，不影响内部章节 ID。</span></label><label class="field"><span class="field-label">分类</span><select data-module-field="category">${['基础入门','网络基础','Web 安全','其他'].map(c=>`<option ${c===m.category?'selected':''}>${c}</option>`).join('')}</select></label></div><label class="field"><span class="field-label">模块简介</span><textarea data-module-field="description" placeholder="用一两句话说明学完能掌握什么">${esc(m.description)}</textarea></label><div class="field"><span class="field-label">阅读权限</span><div class="access-options"><label><input type="radio" name="access" value="public" ${m.access==='public'?'checked':''}>公开全文</label><label><input type="radio" name="access" value="member" ${m.access==='member'?'checked':''}>登录阅读全文</label></div><span class="field-help">标题、模块介绍和章节大纲始终公开。</span></div>${m.published?'<div class="form-footer"><span class="tiny muted">下架后保留内容与学习记录。</span><button class="btn danger" id="unpublish-module">下架模块</button></div>':''}</div>`;document.querySelectorAll('[data-module-field]').forEach(el=>el.oninput=()=>{m[el.dataset.moduleField]=el.value;changed()});document.querySelectorAll('[name=access]').forEach(el=>el.onchange=()=>{m.access=el.value;changed()});const u=document.getElementById('unpublish-module');if(u)u.onclick=()=>confirmAction('下架模块？','引用该模块的路线会保留模块位置，但应暂停对用户开放。原型将同时下架引用它的已发布路线。',()=>{m.published=null;state.routes.forEach(r=>{if(r.published?.moduleIds.includes(m.id))r.published=null});changed();save();moduleEditor(m.id);toast('模块已下架')})}
function chapterEditor(m){if(!m.chapters.some(c=>c.id===selectedChapter))selectedChapter=m.chapters[0]?.id||null;document.getElementById('module-body').innerHTML=`<div class="editor-layout"><aside class="chapter-list"><div class="chapter-list-head"><span>章节 · ${m.chapters.length}</span><button class="icon-btn" id="add-chapter" aria-label="添加章节">＋</button></div><div id="chapter-rows">${m.chapters.map((c,i)=>`<div class="chapter-item ${c.id===selectedChapter?'selected':''}" draggable="true" data-drag-chapter="${i}"><span class="grip" aria-hidden="true">⠿</span><button class="chapter-select" data-chapter="${c.id}"><strong>${i+1}. ${esc(c.title)}</strong><small>${c.questions.length} 道练习 · ${c.minutes} 分钟</small></button><div class="reorder"><button data-chapter-move="${i},-1" ${i===0?'disabled':''} aria-label="上移 ${esc(c.title)}">↑</button><button data-chapter-move="${i},1" ${i===m.chapters.length-1?'disabled':''} aria-label="下移 ${esc(c.title)}">↓</button></div></div>`).join('')||'<div class="empty">还没有章节</div>'}</div></aside><section class="panel" id="chapter-panel"></section></div>`;document.getElementById('add-chapter').onclick=()=>{const c=newChapter();m.chapters.push(c);selectedChapter=c.id;editorTab='markdown';changed();chapterEditor(m)};document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{selectedChapter=b.dataset.chapter;editorTab='markdown';chapterEditor(m)});document.querySelectorAll('[data-chapter-move]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.chapterMove.split(',').map(Number);move(m.chapters,i,i+d);changed();chapterEditor(m)});bindDrag('[data-drag-chapter]',m.chapters,()=>{changed();chapterEditor(m)});const c=m.chapters.find(x=>x.id===selectedChapter);if(!c){document.getElementById('chapter-panel').innerHTML='<div class="empty">点击左侧 ＋ 添加第一章。</div>';return}chapterPanel(m,c)}
function chapterPanel(m,c){document.getElementById('chapter-panel').innerHTML=`<div class="panel-head"><h2>编辑章节</h2><button class="danger-link" id="remove-chapter">删除章节</button></div><div class="field-row"><label class="field"><span class="field-label">章节名称</span><input id="chapter-title" value="${esc(c.title)}" maxlength="100"></label><label class="field"><span class="field-label">预计学习时间 / 分钟</span><input id="chapter-minutes" type="number" min="1" max="999" value="${c.minutes}"></label></div><div class="source-label"><span>Markdown 来源</span><span class="muted tiny">示例链接 · 不发起网络请求</span></div><div class="source-row"><input id="chapter-source" type="url" value="${esc(c.source)}" placeholder="https://github.com/owner/repo/blob/main/chapter.md" aria-label="Markdown 来源"><button class="btn secondary" id="sync-source">同步预览</button></div><div class="editor-tabs">${[['markdown','Markdown'],['questions','章节练习'],['preview','阅读预览']].map(([k,v])=>`<button class="${editorTab===k?'active':''}" data-editor-tab="${k}">${v}${k==='questions'?' · '+c.questions.length:''}</button>`).join('')}</div><div id="chapter-editor-body"></div>`;document.getElementById('chapter-title').oninput=e=>{c.title=e.target.value;changed();const text=document.querySelector(`[data-chapter="${c.id}"] strong`);if(text)text.textContent=(m.chapters.indexOf(c)+1)+'. '+c.title};document.getElementById('chapter-minutes').oninput=e=>{c.minutes=Math.max(1,Math.min(999,Number(e.target.value)||1));changed()};document.getElementById('chapter-source').oninput=e=>{c.source=e.target.value;changed()};document.querySelectorAll('[data-editor-tab]').forEach(b=>b.onclick=()=>{editorTab=b.dataset.editorTab;chapterPanel(m,c)});document.getElementById('sync-source').onclick=()=>{if(!validSource(c.source))return toast('请填写有效的 HTTPS 文档地址');modal(`<h2>同步内容预览</h2><p>原型不访问 GitHub。这里展示当前演示 Markdown；正式版本将在此对比远端新版本与当前草稿，确认后再更新。</p><div class="markdown-preview">${markdown(c.body)}</div><div class="modal-footer"><button class="btn secondar function markdown(text){let code=false,buffer='',html='';for(const line of String(text).split('\n')){if(line.startsWith('```')){if(code){html+='<pre>'+esc(buffer)+'</pre>';buffer=''}code=!code;continue}if(code){buffer+=line+'\n';continue}if(line.startsWith('## '))html+='<h2>'+esc(line.slice(3))+'</h2>';else if(line.startsWith('# '))html+='<h1>'+esc(line.slice(2))+'</h1>';else if(line.trim())html+='<p>'+esc(line)+'</p>'}if(buffer)html+='<pre>'+esc(buffer)+'</pre>';return html}

function moduleErrors(m){const e=[];if(!m.title.trim())e.push('填写模块名称');if(!validSlug(m.slug))e.push('使用有效的访问标识');if(state.modules.some(x=>x.id!==m.id&&x.slug===m.slug))e.push('模块访问标识不能重复');if(!m.chapters.length)e.push('至少添加一个章节');m.chapters.forEach((c,i)=>{if(!c.title.trim()||!c.body.trim())e.push(`第 ${i+1} 章需要名称和正文`);if(!validSource(c.source))e.push(`第 ${i+1} 章需要 HTTPS Markdown 来源`);if(c.questions.some(q=>!q.prompt.trim()||!q.answer.trim()))e.push(`第 ${i+1} 章的练习题需要题目和标准答案`)});return e}

function routeList(){crumb('内容管理 / 学习路线');app.innerHTML=`<div class="page-head"><div><h1>学习路线</h1><p>将已有模块组合成有顺序的学习路径。</p></div><button class="btn" id="new-route">＋ 新建路线</button></div><div class="table-wrap"><table><thead><tr><th>路线</th><th>状态</th><th class="hide-mobile">模块</th><th></th></tr></thead><tbody>${state.routes.map(r=>`<tr><td><a href="#route/${r.id}"><strong>${esc(r.title)}</strong></a><p>/${esc(r.slug)}</p></td><td>${status(r,'route')}</td><td class="hide-mobile muted">${r.moduleIds.length} 模块</td><td class="row-actions"><a href="#route/${r.id}">编排 →</a></td></tr>`).join('')}</tbody></table></div><p class="note">路线引用模块，不复制内容。同一个模块可以加入多条路线。</p>`;document.getElementById('new-route').onclick=()=>{modal(`<h2>新建路线</h2><form id="create-route"><label class="field"><span class="field-label">路线名称</span><input name="title" required maxlength="80" placeholder="例如：Web 安全入门"></label><label class="field"><span class="field-label">访问标识</span><input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="例如：web-security"></label><div class="modal-footer"><button class="btn secondary" type="button" data-close>取消</button><button class="btn">创建路线</button></div></form>`);document.getElementById('create-route').onsubmit=routeCreateHandler}}

function routeEditor(id){const r=state.routes.find(x=>x.id===id);if(!r)return notFound();crumb(`<a href="#routes">学习路线</a> / ${esc(r.title)}`);app.innerHTML=`<div class="page-head"><div><div class="title-row"><h1 style="margin:0">${esc(r.title)}</h1>${status(r,'route')}</div><p style="margin-top:7px">${r.moduleIds.length} 模块 · /paths/${esc(r.slug)}</p></div><div class="actions"><span class="save-state" data-save-state>${unsaved?'有未保存修改':'草稿已保存'}</span><button class="btn secondary" id="preview-route">预览路线</button><button class="btn secondary" id="save-route">保存草稿</button><button class="btn" id="publish-route">${r.published?'发布更新':'发布路线'}</button></div></div><div class="route-layout"><section><div class="table-wrap"><div class="route-list-head"><strong>路线中的模块</strong><button class="btn secondary" id="pick-modules">＋ 添加模块</button></div><div id="route-modules">${r.moduleIds.map((id,i)=>{const m=state.modules.find(x=>x.id===id);return `<div class="route-item" draggable="true" data-drag-route="${i}"><span class="number">${String(i+1).padStart(2,'0')}</span><div class="route-info"><a href="#module/${id}"><strong>${esc(m?.title||'模块不存在')}</strong></a><p>${m?.chapters.length||0} 章节 · ${esc(m?.category||'')}</p></div><span class="status ${m?.published?'live':''}">${m?.published?'已发布':'模块未发布'}</span><div class="reorder"><button data-route-move="${i},-1" ${i===0?'disabled':''} aria-label="上移 ${esc(m?.title)}">↑</button><button data-route-move="${i},1" ${i===r.moduleIds.length-1?'disabled':''} aria-label="下移 ${esc(m?.title)}">↓</button></div><button class="icon-btn" data-remove-module="${id}" aria-label="移除 ${esc(m?.title)}">×</button></div>`}).join('')||'<div class="empty">先添加模块，再安排学习顺序。</div>'}</div></div><p class="note">可拖动或使用上下箭头排序。移出路线不会删除模块；所有模块发布后才能发布路线。</p></section><aside class="panel route-side"><h2>路线信息</h2><label class="field"><span class="field-label">路线名称</span><input data-route-field="title" value="${esc(r.title)}" maxlength="80"></label><label class="field"><span function move(arr,from,to){if(to<0||to>=arr.length)return;const [item]=arr.splice(from,1);arr.splice(to,0,item)}

.minutes} 分钟</span></div></div>`).join('')||'<div class="user-empty">还没有学习记录。</div>'}</section><p class="note">学习数据为只读演示，不提供直接修改进度或查看用户答案的操作。</p>`}else{const logs=state.userAudit.filter(a=>a.userId===u.id);host.innerHTML=`<section class="panel"><h2>管理操作日志</h2>${logs.map(a=>`<div class="audit-item"><span class="audit-dot"></span><div><strong>${esc(a.action)}</strong><p>${esc(a.reason||'未填写说明')}</p><time>${esc(new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(a.at)))} · ${esc(a.actor)}</time></div></div>`).join('')||'<div class="user-empty">暂无管理操作。修改角色、账户状态或备注后会记录在这里。</div>'}</section><p class="note">仅记录本地原型中的管理动作，尚未接入真实审计服务。</p>`}}

function changeUserRole(u){if(!canManageUser(u))return toast('不能修改当前管理员的角色');modal(`<h2>修改 ${esc(u.name)} 的角色</h2><div class="role-note">管理员可以编辑和发布内容、管理路线与用户；普通用户只能使用学习功能。</div><form id="user-role-form"><label class="field"><span class="field-label">角色</span><select name="role"><option value="user" ${u.role==='user'?'selected':''}>普通用户</option><option value="admin" ${u.role==='admin'?'selected':''}>管理员</option></select></label><label class="field"><span class="field-label">操作说明</span><input name="reason" placeholder="例如：加入内容维护团队" maxlength="200"></label><div class="user-form-error" id="role-error" role="alert"></div><div class="modal-footer"><button type="button" class="btn secondary" data-close>取消</button><button class="btn" type="submit">确认修改</button></div></form>`);document.getElementById('user-role-form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target),role=data.get('role');if(role===u.role){closeModal();return toast('角色没有变化')}if(role!=='admin'&&lastActiveAdmin(u)){document.getElementById('role-error').textContent='至少保留一位正常状态的管理员。';return}const before=roleName(u);if(!commitUserAction(()=>{u.role=role;audit(u.id,'修改角色：'+before+' → '+roleName(u),data.get('reason').trim())}))return;closeModal();userDetail(u.id);toast('角色已更新')}}

function renderUserEnvironment(u){const rt=ensureRuntime(u),policy=u.runtimePolicy,inst=rt.instance,running=inst?.state==='running';document.getElementById('user-detail-body').innerHTML=`<div class="environment-metrics"><section class="usage-metric"><span class="metric-label">CLI 连接时长 · 近 30 天</span><div class="metric-value">${rt.cliMinutes}<small>分钟</small></div><div class="metric-caption">各终端连接时长累加，包含当前连接</div></section><section class="usage-metric"><span class="metric-label">GUI 连接时长 · 近 30 天</span><div class="metric-value">${rt.guiMinutes}<small>分钟</small></div><div class="metric-caption">桌面连接时长，不等于桌面进程存活时间</div></section><section class="usage-metric"><span class="metric-label">实例占用时长 · 近 30 天</span><div class="metric-value">${rt.instanceMinutes}<small>分钟</small></div><div class="metric-caption">按实例存活时间统计，不重复叠加 CLI / GUI</div></section></div><div class="environment-grid"><div><section class="env-section"><div class="env-head"><h2>当前练习环境</h2>${running?`<button class="btn danger" id="release-environment">释放整个环境</button>`:'<span class="tiny muted">未运行</span>'}</div>${running?`<div class="env-facts"><div class="env-fact"><span>实例 / Worker</span><strong>${esc(inst.id)} / ${esc(inst.worker)}</strong></div><div class="env-fact"><span>状态</span><strong class="env-status-text">运行中 · 演示快照</strong></div><div class="env-fact"><span>已运行 / 剩余时间</span><strong>${inst.runningMinutes} 分钟 / ${inst.remainingMinutes} 分钟</strong></div><div class="env-fact"><span>最近交互</span><strong>${inst.idleMinutes} 分钟前</strong></div></div><table class="session-table"><thead><tr><th>会话</th><th>状态</th><th>连接时长</th><th></th></tr></thead><tbody>${rt.sessions.filter(s=>!s.ended).map(s=>`<tr><td>${esc(s.label)}<span class="session-hint">${s.type==='cli'?'PTY · '+esc(s.id):'TigerVNC / MATE'}</span></td><td>${s.connected?'已连接':'未连接'}<span class="session-hint">${s.type==='gui'&&!s.connected?'桌面仍在运行':'最近输入 '+esc(s.lastInput)}</span></td><td>${s.minutes} 分钟</td><td><button class="btn secondary" data-runtime-session="${s.id}" ${!s.connected?'disabled':''}>${s.type==='cli'?'结束会话':'断开连接'}</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">没有当前会话。</td></tr>'}</tbody></table><p class="session-scope-note">CLI 结束会话会关闭该终端与 PTY；GUI 断开只关闭连接，桌面继续运行。释放环境会终止所有终端、桌面和进程。</p>`:'<div class="env-empty">当前没有运行中的练习环境。<br><span class="tiny">历史使用量和会话记录仍然保留。</span></div>'}</section><section class="env-section env-history"><div class="env-head"><h2>最近使用记录</h2><span class="tiny muted">最近 ${Math.min(8,rt.history.length)} 条</span></div>${rt.history.length?`<table><thead><tr><th>对象</th><th>时长</th><th class="history-mobile-hide">结果</th></tr></thead><tbody>${rt.history.slice(0,8).map(r=>`<tr><td>${esc(r.label)}<span class="history-meta">${esc(r.when)}</span></td><td>${r.duration} 分钟</td><td class="history-mobile-hide muted">${esc(r.result)}</td></tr>`).join('')}</tbody></table>`:'<p class="user-empty">暂无使用记录。</p>'}</section></div><aside class="environment-policy-side"><section class="env-section env-policy"><h2>环境使用策略</h2><form id="runtime-policy-form"><div class="field"><span class="field-label">允许接入练习环境</span><div class="access-options"><label><input name="allowed" type="radio" value="yes" ${policy.allowed?'checked':''}>允许</label><label><input name="allowed" type="radio" value="no" ${policy.allowed?'':'checked'}>禁止</label></div><span class="field-help">禁止新建环境与新接入，不自动释放当前实例。</span></div><label class="field"><span class="field-label">实例最长运行时间 / 分钟</span><input name="maxMinutes" type="number" min="10" max="1440" step="1" value="${policy.maxMinutes}" required></label><label class="field"><span class="field-label">无交互回收阈值 / 分钟</span><input name="idleMinutes" type="number" min="1" max="1440" step="1" value="${policy.idleMinutes}" required><span class="field-help">按键盘、鼠标等真实输入判定，不用画面刷新或连接保活续期。</span></label><div id="runtime-policy-error" class="user-form-error" role="alert"></div><button class="btn secondary" type="submit">保存策略</button><p class="panel-footnote">时限调整仅应用于新建实例。账户停用仍优先禁止登录与环境接入。 function runtimeAction(u,target){const rt=ensureRuntime(u);if(!rt.instance||rt.instance.state!=='running')return toast('当前没有运行环境');const session=rt.sessions.find(s=>s.id===target),release=target==='release';if(!release&&(!session||session.ended||!session.connected))return toast('会话已经结束或断开');const title=release?'释放整个练习环境？':session.type==='cli'?'结束这个终端会话？':'断开远程桌面连接？';const impact=release?'终止此用户所有终端、桌面和后台进程，并销毁临时实例。该操作不删除账户或学习进度。':session.type==='cli'?'关闭这个 CLI 连接和对应 PTY。该终端中的前台任务可能终止，其他终端与桌面不受影响。':'仅断开当前 GUI 连接，保留桌面进程。用户获准后可重新连接原桌面，CLI 不受影响。';modal(`<h2>${title}</h2><div class="env-action-note">${esc(impact)}</div><p class="tiny muted">仅模拟管理控制。正式版需向 Worker 下发指令并确认结果；无法确认时应显示待确认，而非已释放。</p><form id="runtime-action-form"><label class="field"><span class="field-label">操作原因</span><input name="reason" maxlength="200" required placeholder="记录本次管理操作的原因"></label><div class="modal-footer"><button type="button" class="btn secondary" data-close>取消</button><button class="btn ${release?'danger':''}" type="submit">${release?'确认释放':session.type==='cli'?'确认结束':'确认断开'}</button></div></form>`);document.getElementById('runtime-action-form').onsubmit=e=>{e.preventDefault();const reason=new FormData(e.target).get('reason').trim();if(!reason)return toast('请填写操作原因');const when=demoTimestamp();if(!commitUserAction(()=>{const rt=ensureRuntime(u),session=rt.sessions.find(s=>s.id===target);if(release){rt.sessions.forEach(s=>{s.connected=false;s.ended=true});rt.history.unshift({label:'实例 · '+rt.instance.id,duration:rt.instance.runningMinutes,when,result:'管理员释放'});rt.instance=null;audit(u.id,'释放练习环境',reason)}else{session.connected=false;if(session.type==='cli')session.ended=true;rt.history.unshift({label:(session.type==='cli'?'CLI · ':'GUI · ')+session.label,duration:session.minutes,when,result:session.type==='cli'?'管理员结束会话':'管理员断开连接，桌面保留'});audit(u.id,session.type==='cli'?'结束 CLI 会话：'+session.id:'断开 GUI 连接',reason)}}))return;closeModal();if(['instances','node'].includes(location.hash.slice(1).split('/')[0]))render();else userDetail(u.id);toast(release?'演示环境已释放':'演示会话控制已完成')}}

function nodeConnection(n){return `<span class="node-state"><i class="node-dot ${n.online?'':'offline'}"></i>${n.online?'在线':'离线'}</span>`}function schedulingText(n){return !n.online?'不可调度':n.accepting?'允许新分配':'已暂停分配'}
function nodeResource(n,key){if(!n.online)return '<span class="muted tiny">遥测不可用</span>';const cpu=key==='cpu',value=cpu?n.cpu:Math.round(n.memoryUsed/n.memoryTotal*100);return `<div class="node-resource"><span><span>${cpu?value+'%':n.memoryUsed+' / '+n.memoryTotal+' GB'}</span></span><div class="bar-bg"><div class="bar-fill ${value>=80?'warning':''}" style="width:${value}%"></div></div></div>`}
function nodeList(){crumb('环境管理 / 节点管理');app.innerHTML=`<div class="page-head"><div><h1>节点管理</h1><p>查看 Worker 健康状态与调度能力。</p></div><div class="actions"><span class="overview-demo">固定演示快照</span><button class="btn secondary" id="node-onboarding">接入说明</button></div></div><div class="inventory"><span>全部节点<strong>${state.nodes.length}</strong></span><span>在线<strong>${state.nodes.filter(n=>n.online).length}</strong></span><span>允许分配<strong>${state.nodes.filter(n=>n.online&&n.accepting).length}</strong></span><a href="#instances">已知运行实例<strong>${allInstances().length}</strong></a></div><div class="node-toolbar"><div class="filters">${[['all','全部'],['online','在线'],['paused','暂停分配'],['offline','离线']].map(([k,v])=>`<button data-node-filter="${k}" class="filter ${nodeFilter===k?'active':''}">${v}</button>`).join('')}</div><input class="search" id="node-search" aria-label="搜索节点" placeholder="搜索节点名称或 ID"></div><div class="table-wrap"><table><thead><tr><th>节点</th><th>状态</th><th class="hide-mobile">CPU</th><th class="hide-mobile">内存</th><th class="hide-mobile">实例</th><th class="hide-mobile">最近心跳</th><th></th></tr></thead><tbody id="node-rows"></tbody></table></div><p class="note">离线不等于实例已释放。离线节点的资源和实例数量无法确认，不参与新分配。</p>`;document.querySelectorAll('[data-node-filter]').forEach(b=>b.onclick=()=>{nodeFilter=b.dataset.nodeFilter;nodeList()});document.getElementById('node-search').value=nodeQuery;document.getElementById('node-search').oninput=e=>{nodeQuery=e.target.value;nodeRows()};document.getElementById('node-onboarding').onclick=()=>modal(`<h2>接入 Worker 节点</h2><p>由 Worker 主动连接 Control，验证集群身份后登记，不通过此页面远程执行命令。</p><ol class="publish-checks"><li>在专用主机准备 Btrfs、Cgroup v2 和网络依赖。</li><li>配置唯一 node_id、Control 地址与集群身份。</li><li>启动与 Control 协议兼容的 Worker。</li><li>等待心跳和实例清单核对，确认后开放新分配。</li></ol><p class="tiny muted">原型不生成凭据，不启动真实节点。</p><div class="modal-footer"><button class="btn secondary" data-close>关闭</button></div>`);nodeRows()}
function nodeRows(){const rows=state.nodes.filter(n=>(nodeFilter==='all'||nodeFilter==='online'&&n.online||nodeFilter==='offline'&&!n.online||nodeFilter==='paused'&&n.online&&!n.accepting)&&[n.name,n.id].some(v=>v.toLowerCase().includes(nodeQuery.toLowerCase())));document.getElementById('node-rows').innerHTML=rows.map(n=>`<tr><td><a href="#node/${n.id}"><strong>${esc(n.name)}</strong></a><p>${esc(n.id)} · ${esc(n.version)}</p></td><td>${nodeConnection(n)}<p>${schedulingText(n)}</p></td><td class="hide-mobile">${nodeResource(n,'cpu')}</td><td class="hide-mobile">${nodeResource(n,'memory')}</td><td class="hide-mobile muted">${n.online?workerInstances(n.id).length+' / '+n.slots:'未知（上次 '+n.lastReported+'）'}</td><td class="hide-mobile muted">${n.heartbeat}</td><td class="row-actions"><a href="#node/${n.id}">查看 →</a></td></tr>`).join('')||'<tr><td class="empty" colspan="7">没有匹配的节点。</td></tr>'}
function nodeOverview(id){const n=state.nodes.find(x=>x.id===id);if(!n)return notFound();crumb(`<a href="#nodes">节点管理</a> / ${esc(n.name)}`);const diskPct=n.online?Math.round(n.diskUsed/n.diskTotal*100):0;app.innerHTML=`<div class="page-head"><div><div class="title-row"><h1 style="margin:0">${esc(n.name)}</h1>${nodeConnection(n)}</div><p style="margin-top:8px">${esc(n.id)} · ${n.version}</p></div><div class="actions"><a class="btn secondary" href="#nodes">返回节点列表</a><button class="btn ${n.accepting?'secondary':''}" id="node-scheduling" ${n.online?'':'disabled title="离线节点不可恢复分配"'}>${n.accepting?'暂停新分配':'恢复分配'}</button></div></div>${!n.online?'<div class="node-notice warning">心跳中断，实时资源与实例数量未知。历史清单不代表实例已经销毁；需恢复连接后核对。</div>':diskPct>=80?'<div class="node-notice warning">磁盘使用率偏高。节点当前已暂停新分配，建议检查容量后再恢复。</div>':!n.accepting?'<div class="node-notice">已暂停新分配。现有环境继续运行，等待用户结束或到期回收。</div>':''}<div class="node-resources">${[['CPU 使用率',n.online?n.cpu+'%':'—',n.online?'遥测快照':'离线，数据不可用',n.cpu],['内存',n.online?n.memoryUsed+' GB':'—',n.online?'总计 '+n.memoryTotal+' GB':'离线，数据不可用',n.online?n.memoryUsed/n.memoryTotal*100:0],['磁盘',n.online?n.diskUsed+' GB':'—',n.online?'总计 '+n.diskTotal+' GB · '+diskPct+'%':'离线，数据不可用',diskPct]].map(([title,value,detail,pct])=>`<section class="node-resource-card"><div class="metric-label">${title}</div><div class="node-resource-value">${value}</div><div class="bar-bg"><div class="bar-fill" style="width:${pct||0}%;${pct>=80?'background:var(--error)':''}"></div></div><p>${detail}</p></section>`).join('')}</div><div class="node-detail-grid"><section class="panel node-instances"><div class="summary-head"><h2>节点上的实例</h2><a href="#instances/${n.id}">查看实例列表 →</a></div>${n.online?instanceTable(workerInstances(n.id)):'<p class="user-empty">当前无法确认。上次心跳报告 '+n.lastReported+' 个实例，不将其计为已释放。</p>'}</section><aside class="panel node-side"><div><h2>节点信息</h2><div class="node-info-line"><span>调度状态</span><strong>${schedulingText(n)}</strong></div><div class="node-info-line"><span>最近心跳</span><strong>${n.heartbeat}</strong></div><div class="node-info-line"><span>可用槽位上限</span><strong>${n.slots}</strong></div><div class="node-info-line"><span>Worker 版本</span><strong>${n.version}</strong></div></div><div><h2 style="margin-top:23px">最近管理操作</h2>${state.platformAudit.filter(a=>a.reason.includes(n.id)).slice(0,3).map(a=>`<div class="ops-log">${esc(a.action)}<small>${esc(a.reason)}</small></div>`).join('')||'<p class="tiny muted">暂无管理操作。</p>'}</div></aside></div><p class="note">所有数据和调度控制均为原型演示，不操作真实 Worker。</p>`;document.getElementById('node-scheduling').onclick=()=>toggleNodeScheduling(n.id);bindInstanceActions()}
function toggleNodeScheduling(id){const n=state.nodes.find(x=>x.id===id);if(!n?.online)return;const pause=n.accepting;modal(`<h2>${pause?'暂停新分配':'恢复分配'}？</h2><p>${pause?'该节点不再接收新实例，当前实例与 CLI / GUI 会话不受影响。':'恢复后可接收新实例。实际系统还需通过健康、磁盘与清单核对检查。'}</p>${!pause&&n.diskUsed/n.diskTotal>=.8?'<div class="node-notice warning">当前磁盘水位偏高，请先处理容量问题。</div>':''}<form id="node-scheduling-form"><label class="field"><span class="field-label">操作原因</span><input name="reason" required maxlength="200" placeholder="例如：维护前停止新增实例"></label><div class="modal-footer"><button class="btn secondary" type="button" data-close>取消</button><button class="btn" ${!pause&&n.diskUsed/n.diskTotal>=.8?'disabled':''}>确认${pause?'暂停':'恢复'}</button></div></form>`);document.getElementById('node-scheduling-form').onsubmit=e=>{e.preventDefault();const reason=new FormData(e.target).get('reason').trim();if(!reason)return toast('请填写操作原因');if(!pause&&n.diskUsed/n.diskTotal>=.8)return toast('先处理磁盘水位');if(!platformCommit(()=>{state.nodes.find(x=>x.id===id).accepting=!pause;platformLog(pause?'暂停新分配':'恢复节点分配',id+' · '+reason)}))return;closeModal();nodeDetail(id);toast('演示调度状态已更新')}}
function instanceTable(rows){return `<table><thead><tr><th>实例 / 用户</th><th class="hide-mobile">Worker</th><th>运行 / 剩余</th><th class="hide-mobile">会话</th><th></th></tr></thead><tbody>${rows.map(({u,rt,instance:i})=>{const cli=rt.sessions.filter(s=>s.type==='cli'&&s.connected&&!s.ended).length,gui=rt.sessions.some(s=>s.type==='gui'&&s.connected&&!s.ended),online=state.nodes.find(n=>n.id===i.worker)?.online;return `<tr><td><strong style="font-size:11px">${esc(i.id)}</strong><a href="#user/${u.id}/environment" class="env-row-meta">${esc(u.name)} →</a></td><td class="hide-mobile"><a href="#node/${i.worker}" class="node-table-link">${esc(i.worker)}</a></td><td class="muted">${i.runningMinutes} / ${i.remainingMinutes} 分钟</td><td class="hide-mobile muted">CLI ${cli} · GUI ${gui?'已连接':'未连接'}</td><td><div class="instance-actions"><a class="node-table-link" href="#user/${u.id}/environment">详情</a><button class="btn danger" data-instance-release="${u.id}" ${online?'':'disabled title="节点离线，无法确认执行结果"'}>释放</button></div></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">没有可确认的运行实例。</td></tr>'}</tbody></table>`}
function bindInstanceActions(){document.querySelectorAll('[data-instance-release]').forEach(b=>b.onclick=()=>{const u=state.users.find(u=>u.id===b.dataset.instanceRelease);if(u)runtimeAction(u,'release')})}
function instanceList(){crumb('环境管理 / 运行实例');const rows=allInstances();app.innerHTML=`<div class="page-head"><div><h1>运行实例</h1><p>按用户或节点查看当前练习环境。</p></div><span class="overview-demo">演示状态 · 非实时</span></div><div class="inventory"><span>已知运行实例<strong>${rows.length}</strong></span><span>CLI 连接<strong>${rows.reduce((n,r)=>n+r.rt.sessions.filter(s=>s.type==='cli'&&s.connected&&!s.ended).length,0)}</strong></span><span>GUI 连接<strong>${rows.reduce((n,r)=>n+(r.rt.sessions.some(s=>s.type==='gui'&&s.connected&&!s.ended)?1:0),0)}</strong></span></div>${state.nodes.some(n=>!n.online)?'<div class="node-notice">有离线节点。下表只列出已知实例，不能据此推断离线节点没有运行环境。</div>':''}<div class="instance-filter"><input id="instance-search" placeholder="搜索实例 ID 或用户名" aria-label="搜索运行实例"><select id="instance-node" aria-label="筛选实例节点"><option value="all">全部节点</option>${state.nodes.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join('')}</select></div><div class="table-wrap" id="instance-table"></div>`;document.getElementById('instance-node').value=instanceNode;document.getElementById('instance-search').value=instanceQuery;document.getElementById('instance-node').onchange=e=>{instanceNode=e.target.value;instanceRows()};document.getElementById('instance-search').oninput=e=>{instanceQuery=e.target.value;instanceRows()};instanceRows()}
function instanceRows(){const q=instanceQuery.toLowerCase();document.getElementById('instance-table').innerHTML=instanceTable(allInstances().filter(r=>(instanceNode==='all'||r.instance.worker===instanceNode)&&[r.instance.id,r.u.name,r.u.id].some(v=>v.toLowerCase().includes(q))));bindInstanceActions()}
function homePublishedChanged(){return JSON.stringify(state.homepage.slides.filter(s=>s.enabled))!==JSON.stringify(state.homepage.published)}
function targetOptions(s){if(s.targetType==='challenges')return '<span class="field-help">跳转到挑战列表。</span>';const list=s.targetType==='route'?state.routes:state.modules;return `<label class="field"><span class="field-label">${s.targetType==='route'?'学习路线':'学习模块'}</span><select id="slide-target-id"><option value="">选择内容</option>${list.map(x=>`<option value="${x.id}" ${s.targetId===x.id?'selected':''}>${esc(x.title)}${x.published?'':'（未发布）'}</option>`).join('')}</select></label>`}
function homeEditor(){crumb('内容管理 / 首页管理');const h=state.homepage;if(!h.slides.some(s=>s.id===selectedHomeSlide))selectedHomeSlide=h.slides[0]?.id||null;app.innerHTML=`<div class="page-head"><div><div class="title-row"><h1 style="margin:0">首页管理</h1>${h.published.length?'<span class="status live">已发布</span>':'<span class="status">未发布</span>'}${homePublishedChanged()?'<span class="status">有草稿修改</span>':''}</div><p style="margin-top:8px">编辑学习首页轮播，保持一个清晰的推荐入口。</p></div><div class="actions"><span class="save-state" data-save-state>${unsaved?'有未保存修改':'草稿已保存'}</span><button class="btn secondary" id="home-preview-live">线上版本</button><button class="btn secondary" id="home-preview">预览草稿</button><button class="btn secondary" id="home-save">保存草稿</button><button class="btn" id="home-publish">发布更新</button></div></div><div class="home-layout"><aside><div class="home-list"><div class="home-list-head"><span>轮播项 · ${h.slides.length} / 5</span><button class="icon-btn" id="add-slide" aria-label="添加轮播项" ${h.slides.length>=5?'disabled':''}>＋</button></div>${h.slides.map((s,i)=>`<div class="home-slide-row ${s.id===selectedHomeSlide?'selected':''}" draggable="true" data-drag-home="${i}"><span class="slide-order">${String(i+1).padStart(2,'0')}</span><button class="slide-row-select" data-home-slide="${s.id}"><strong>${esc(s.label||'未命名推荐')}</strong><small>${s.enabled?'已启用':'未启用'} · ${s.targetType==='module'?'学习模块':s.targetType==='route'?'学习路线':'挑战列表'}</small></button><div class="reorder"><button data-slide-move="${i},-1" ${i===0?'disabled':''} aria-label="上移轮播项">↑</button><button data-slide-move="${i},1" ${i===h.slides.length-1?'disabled':''} aria-label="下移轮播项">↓</button></div></div>`).join('')}</div><p class="home-description">最多 5 项，可拖动或用箭头排序。只轮播已启用项，发布前先预览。</p></aside><section class="panel" id="slide-editor"></section></div>`;document.getElementById('add-slide').onclick=()=>{if(h.slides.length>=5)return;const s=homeSlide('新推荐','','','查看内容','module','',false);h.slides.push(s);selectedHomeSlide=s.id;changed();homeEditor()};document.querySelectorAll('[data-home-slide]').forEach(b=>b.onclick=()=>{selectedHomeSlide=b.dataset.homeSlide;homeEditor()});document.querySelectorAll('[data-slide-move]').forEach(b=>b.onclick=()=>{const[i,d]=b.dataset.slideMove.split(',').map(Number);move(h.slides,i,i+d);changed();homeEditor()});bindHomeDrag();document.getElementById('home-save').onclick=()=>{if(save())toast('轮播草稿已保存，线上版本未变化')};document.getElementById('home-preview').onclick=()=>previewHome(false);document.getElementById('home-preview-live').onclick=()=>previewHome(true);document.getElementById('home-publish').onclick=publishHome;const selected=h.slides.find(s=>s.id===selectedHomeSlide);if(selected)slideEditor(selected);else document.getElementById('slide-editor').innerHTML='<div class="empty">添加第一条推荐内容。</div>'}
function bindHomeDrag(){document.querySelectorAll('[data-drag-home]').forEach(el=>{el.ondragstart=e=>{dragItem=Number(el.dataset.dragHome);e.dataTransfer.setData('text/plain',String(dragItem))};el.ondragover=e=>{e.preventDefault();el.classList.add('drag-over')};el.ondragleave=()=>el.classList.remove('drag-over');el.ondragend=()=>{dragItem=null};el.ondrop=e=>{e.preventDefault();if(dragItem!==null){move(state.homepage.slides,dragItem,Number(el.dataset.dragHome));dragItem=null;changed();homeEditor()}}})}
function slideEditor(s){document.getElementById('slide-editor').innerHTML=`<div class="panel-head"><h2>编辑轮播项</h2><button class="danger-link" id="delete-slide">删除</button></div><div class="field-row"><label class="field"><span class="field-label">栏目标签</span><input data-slide-field="label" value="${esc(s.label)}" maxlength="16" placeholder="例如：本期精选"></label><label class="field"><span class="field-label">展示状态</span><span class="home-enabled" style="padding:9px 0"><input id="slide-enabled" type="checkbox" ${s.enabled?'checked':''}>在首页轮播中启用</span></label></div><label class="field"><span class="field-label">标题</span><input data-slide-field="title" value="${esc(s.title)}" maxlength="50" placeholder="一句话说明推荐理由"></label><label class="field"><span class="field-label">简介</span><textarea data-slide-field="description" maxlength="150">${esc(s.description)}</textarea></label><div class="field-row"><label class="field"><span class="field-label">按钮文字</span><input data-slide-field="button" value="${esc(s.button)}" maxlength="20"></label><label class="field"><span class="field-label">跳转类型</span><select id="slide-target-type">${[['module','学习模块'],['route','学习路线'],['challenges','挑战列表']].map(([k,v])=>`<option value="${k}" ${k===s.targetType?'selected':''}>${v}</option>`).join('')}</select></label></div><div id="slide-target-field">${targetOptions(s)}</div><div class="field home-illustration-field"><span class="field-label">右侧配图</span><select id="slide-art"><option value="terminal" ${s.art==='terminal'?'selected':''}>默认终端插画</option><option value="image" ${s.art==='image'?'selected':''}>图片链接</option><option value="none" ${s.art==='none'?'selected':''}>不显示配图</option></select><div class="home-image-field" id="home-image-field" ${s.art==='image'?'':'hidden'}><input data-slide-field="image" value="${esc(s.image)}" placeholder="https://…" aria-label="轮播图片链接"><span class="field-help">使用 HTTPS 图片。原型预览会请求该图片地址。</span></div></div><p class="tiny muted" style="margin:0">标签、标题与按钮会在用户端展示。目标内容必须已发布才能启用 function serviceStatus(c){return c.verification==='passed'?'模拟验证通过':c.verification==='failed'?'模拟验证失败':c.verification==='configured'?'已配置 · 未验证':'未配置'}
function serviceStatusHTML(c){return `<div class="integration-state ${c.verification==='passed'?'tested':c.verification==='failed'?'failed':''}"><i></i>${serviceStatus(c)}</div>`}
function integrationList(){const host=document.getElementById('control-body');if(selectedIntegration){integrationEditor(selectedIntegration);return}host.innerHTML=`<div class="integration-demo">这里只演示配置与验证流程，不请求服务商。请勿输入真实密钥：密码字段仅用于体验替换操作，原型不会存储其内容。</div><div class="integration-list">${Object.entries(integrationMeta).map(([id,m])=>{const c=state.integrations[id];return `<section class="integration-card"><span class="integration-symbol">${m.symbol}</span><h2>${m.title}</h2><p>${m.description}</p>${serviceStatusHTML(c)}<div class="integration-card-footer"><span class="integration-enabled">${c.enabled?'已启用':'未启用'}</span><button class="btn secondary" data-integration="${id}">配置 →</button></div></section>`}).join('')}</div><p class="note">邮箱、单点登录和 Turnstile 分别管理。DNS 自动化、R2 与对外 API 密钥暂不加入第一版。</p>`;document.querySelectorAll('[data-integration]').forEach(b=>b.onclick=()=>{selectedIntegration=b.dataset.integration;integrationEditor(selectedIntegration)})}
function credentialField(c){return `<div class="credential-section"><div class="credential-state"><label for="integration-secret">服务端密钥</label>${c.secretConfigured?'<span class="credential-present">已配置 <button class="credential-clear" id="clear-service-secret" type="button">清除</button></span>':'<span class="tiny muted">尚未配置</span>'}</div><input id="integration-secret" class="secret-input" type="password" autocomplete="new-password" placeholder="${c.secretConfigured?'留空保留，输入演示值可替换':'仅输入演示值，勿使用真实凭据'}"><p class="credential-note">保存后只显示配置状态。原型仅记录“已配置”，不会保存或回传密码内容。</p></div>`}
function emailFields(c){return `<label class="field"><span class="field-label">发送方式</span><select id="email-provider"><option value="resend" ${c.provider==='resend'?'selected':''}>Resend API</option><option value="smtp" ${c.provider==='smtp'?'selected':''}>SMTP</option></select></label><div class="field-row"><label class="field"><span class="field-label">发件名称</span><input name="fromName" value="${esc(c.fromName)}" maxlength="80" required></label><label class="field"><span class="field-label">发件邮箱</span><input name="fromEmail" type="email" value="${esc(c.fromEmail)}" required placeholder="noreply@example.com"></label></div>${c.provider==='smtp'?`<div class="field-row"><label class="field"><span class="field-label">SMTP 主机</span><input name="smtpHost" value="${esc(c.smtpHost)}" placeholder="smtp.example.com" required></label><label class="field"><span class="field-label">端口</span><input name="smtpPort" type="number" min="1" max="65535" value="${c.smtpPort}" required></label></div><div class="field-row"><label class="field"><span class="field-label">传输加密</span><select name="smtpSecurity"><option value="tls" ${c.smtpSecurity==='tls'?'selected':''}>TLS</option><option value="starttls" ${c.smtpSecurity==='starttls'?'selected':''}>STARTTLS</option></select></label><label class="field"><span class="field-label">SMTP 用户名</span><input name="smtpUser" value="${esc(c.smtpUser)}" required></label></div><p class="field-help">下方密钥对应 SMTP 密码。</p>`:'<p class="field-help">下方密钥对应 Resend API Key，发件域名需在服务商处验证。</p>'}`}
function ssoCallback(c){return state.control.site.url.replace(/\/$/,'')+'/api/auth/callback/'+(c.provider==='github'?'github':'oidc')}
function ssoFields(c){return `<label class="field"><span class="field-label">身份提供方</span><select id="sso-provider"><option value="github" ${c.provider==='github'?'selected':''}>GitHub OAuth</option><option value="oidc" ${c.provider==='oidc'?'selected':''}>OIDC / 企业身份平台</option></select></label>${c.provider==='oidc'?`<label class="field"><span class="field-label">Issuer 地址</span><input name="issuer" value="${esc(c.issuer)}" placeholder="https://identity.example.com" required><span class="field-help">正式版本通过 OIDC Discovery 获取端点并验证身份。</span></label>`:''}<label class="field"><span class="field-label">Client ID</span><input name="clientId" value="${esc(c.clientId)}" required autocomplete="off"></label><label class="field"><span class="field-label">回调地址</span><input class="readonly-callback" readonly value="${esc(ssoCallback(c))}"><span class="field-help">根据站点地址自动生成，请配置到提供方。不是向客户端暴露密钥的地址。</span></label><p class="field-help">保留本地管理员登录。第三方身份绑定在正式版本中需要独立处理，不自动合并同名账户。</p>`}
function turnstileFields(c){return `<label class="field"><span class="field-label">Site Key</span><input name="siteKey" value="${esc(c.siteKey)}" required placeholder="公开站点标识"></label><div class="field"><span class="field-label">使用场景</span><div class="scene-picks">${[['register','注册'],['login','登录'],['reset','找回密码']].map(([k,v])=>`<label><input name="scenes" type="checkbox" value="${k}" ${c.scenes.includes(k)?'checked':''}>${v}</label>`).join('')}</div><span class="field-help">使用 Turnstile 专用 Secret Key，不需要 Cloudflare 通用 API Token。</span></div><p class="field-help">生产环境需要在服务端验证 token，且在 Cloudflare 控制台配置允许的站点域名。</p>`}
function integrationEditor(id,formDraft=null){const c=state.integrations[id],m=integrationMeta[id],view=formDraft||c;const host=document.getElementById('control-body');host.innerHTML=`<button class="integration-back" id="back-integrations">← 服务接入</button><div class="integration-demo">本页面不连接真实服务。请只输入演示密钥；配置状态会保存，密钥内容不会进入本地存储、日志或预览。</div><div class="integration-detail"><form id="integration-form"><section class="settings-section"><h2>${m.title}</h2><p class="settings-description">保存配置与验证可用性是两个独立步骤。更换配置后需要重新测试并启用。</p>${id==='email'?emailFields(view):id==='sso'?ssoFields(view):turnstileFields(view)}${credentialField({...view,secretConfigured:c.secretConfigured&&(!view.provider||view.provider===c.provider)})}<div id="integration-error" class="service-error" role="alert" style="margin-top:15px"></div></section><div class="settings-footer"><span class="tiny muted">修改已启用服务的配置会使其停用，原型要求重新测试后再启用。</span><button class="btn" type="submit">保存配置</button></div></form><aside class="integration-state-card"><h2>服务状态</h2>${serviceStatusHTML(c)}<dl><div class="info-item"><dt>启用状态</dt><dd>${c.enabled?'已启用':'未启用'}</dd></div><div class="info-item"><dt>密钥</dt><dd>${c.secretConfigured?'已配置 · 仅状态':'未配置'}</dd></div><div class="info-item"><dt>最近模拟测试</dt><dd class="service-timestamp">${esc(c.lastTest||'尚未测试')}</dd></div></dl><button class="btn secondary" id="test-integration" type="button" ${c.verification==='unconfigured'?'disabled':''}>${m.test}（演示）</button><button class="btn ${c.enabled?'secondary':''}" id="toggle-integration" type="button" ${!c.enabled&&c.verification!=='passed'?'disabled':''}>${c.enabled?'停用服务':'启用服务'}</button><p class="integration-preview-note">“模拟验证通过”仅代表原型流程，不证明服务商连接或认证成功。</p></aside></div>`;document.getElementById('back-integrations').onclick=()=>{selectedIntegration=null;integrationList()};const selector=document.getElementById(id==='email'?'email-provider':id==='sso'?'sso-provider':'no-provider');if(selector)selector.onchange=e=>{const form=document.getElementById('integration-form'),draft={...view};for(const key of ['fromName','fromEmail','smtpHost','smtpUser','clientId','issuer'])if(form.elements[key])draft[key]=form.elements[key].value;draft.provider=e.target.value;integrationEditor(id,draft)};
const clear=document.getElementById('clear-service-secret');if(clear)clear.onclick=()=>confirmAction('清除服务密钥配置？','本地配置标记将被清除，服务停用，测试状态重置。原型中没有保存真实密钥。',()=>{if(!platformCommit(()=>{const live=state.integrations[id];live.secretConfigured=false;live.enabled=false;live.verification='unconfigured';live.lastTest='';platformLog('清除服务密钥配置',m.title+' · 仅状态标记')}))return;integrationEditor(id);toast('配置标记已清除')});
document.getElementById('integration-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),current=state.integrations[id],secret=document.getElementById('integration-secret').value,provider=selector?.value;let next={...current},error='';if(id==='email'){next={...next,provider,fromName:d.get('fromName').trim(),fromEmail:d.get('fromEmail').trim()};if(provider==='smtp'){next.smtpHost=d.get('smtpHost').trim();next.smtpPort=Number(d.get('smtpPort'));next.smtpSecurity=d.get('smtpSecurity');next.smtpUser=d.get('smtpUser').trim()}}else if(id==='sso'){next.provider=provider;next.clientId=d.get('clientId').trim();next.issuer=provider==='oidc'?d.get('issuer').trim():'';if(next.provider==='oidc'&&!validSource(next.issuer))error='Issuer 需要有效的 HTTPS 地址。'}else{next.siteKey=d.get('siteKey').trim();next.scenes=d.getAll('scenes');if(!next.scenes.length)error='请选择至少一个使用场景。'}const providerChanged=provider&&provider!==current.provider;next.secretConfigured=secret.trim().length>0||(!providerChanged&&current.secretConfigured);if(!next.secretConfigured)error='请填写演示密钥；更换提供方需要重新配置。';if(error){document.getElementById('integration-error').textContent=error;return}const changedConfig=JSON.stringify({...next,verification:'',enabled:false,lastTest:''})!==JSON.stringify({...current,verification:'',enabled:false,lastTest:''})||secret.trim().length>0;if(!changedConfig)return toast('配置没有变化');next.verification='configured';next.enabled=false;next.lastTest='';if(!platformCommit(()=>{state.integrations[id]=next;platformLog('更新服务接入配置',m.title+' · 不记录密钥内容')}))return;document.getElementById('integration-secret').value='';integrationEditor(id);toast('配置已保存，尚未验证')};document.getElementById('test-integration').onclick=()=>testIntegration(id);document.getElementById('toggle-integration').onclick=()=>{const live=state.integrations[id];if(!live.enabled&&live.verification!=='passed')return toast('请先完成模拟验证');confirmAction(live.enabled?'停用这项服务？':'启用这项服务？',id==='sso'?'本地管理员登录始终保留。操作只改变演示状态。':'操作仅改变本地演示状态，不请求服务商。',()=>{if(!platformCommit(()=>{const current=state.integrations[id];current.enabled=!current.enabled;platformLog(current.enabled?'启用服务':'停用服务',m.title)}))return;integrationEditor(id);toast('演示启用状态已更新')})}}
function testIntegration(id){const m=integrationMeta[id],c=state.integrations[id];if(c.verification==='unconfigured')return toast('请先保存完整配置');modal(`<h2>${m.test} · 演示</h2><p>不会发送邮件、打开真实授权或请求 Cloudflare。选择一个结果，查看对应的配置状态。</p>${id==='email'?'<label class="field"><span class="field-label">测试收件地址</span><input id="test-recipient" type="email" placeholder="review@example.com"><span class="field-help">不会发送或保存收件地址。</span></label>':''}<div class="modal-footer test-outcome-buttons"><button class="btn secondary" id="simulate-service-fail">模拟失败</button><button class="btn" id="simulate-service-pass">模拟通过</button></div>`);for(const result of ['pass','fail'])document.getElementById('simulate-service-'+result).onclick=()=>{const receiver=document.getElementById('test-recipient');if(receiver&&(!receiver.value.trim()||!receiver.checkValidity())){receiver.reportValidity();if(!receiver.value.trim()){receiver.setCustomValidity('请填写测试收件地址');receiver.reportValidity();receiver.setCustomValidity('')}return}if(!platformCommit(()=>{const live=state.integrations[id];live.verification=result==='pass'?'passed':'failed';live.lastTest=demoTimestamp();if(result==='fail')live.enabled=false;platformLog('模拟服务验证'+(result==='pass'?'通过':'失败'),m.title)}))return;closeModal();integrationEditor(id);toast(result==='pass'?'模拟通过，可启用服务':'模拟失败，服务保持停用')}}
function systemAuth(){const p=state.control.policy;document.getElementById('control-body').innerHTML=`<form id="system-auth-form" class="control-setting-form"><section class="settings-section"><h2>本地登录</h2><div class="auth-summary"><input type="checkbox" checked disabled aria-label="保留本地管理员登录"><span>保留本地管理员登录</span></div><p class="settings-description">单点登录是额外入口。第一版不提供关闭本地管理员登录的选项，避免错误配置后失去管理入口。</p><div class="field-row">${numericField('sessionHours','登录有效期 / 小时',p.sessionHours,1,168)}${numericField('ticketSeconds','CLI / GUI Ticket 有效期 / 秒',p.ticketSeconds,15,300,'一次性连接凭证，和实例运行寿命不同。')}</div></section><section class="settings-section"><h2>第三方认证</h2><p class="settings-description">在服务接入中分别配置单点登录、邮件验证和 Turnstile，不在这里重复填写密钥。</p><button class="btn secondary" type="button" id="open-auth-services">管理服务接入 →</button></section><div class="settings-footer"><span class="tiny muted">保存只影响本地原型策略，不使真实用户会话失效。</span><button class="btn" type="submit">保存认证设置</button></div></form>`;document.getElementById('open-auth-services').onclick=()=>{controllerTab='services';selectedIntegration=null;controlPage()};document.getElementById('system-auth-form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),session=Number(d.get('sessionHours')),ticket=Number(d.get('ticketSeconds'));if(!platformCommit(()=>{state.control.policy.sessionHours=session;state.control.policy.ticketSeconds=ticket;platformLog('更新登录与认证设置','登录时限及一次性接入 Ticket 时限')}))return;systemAuth();toast('演示认证设置已保存')}}
function systemDomains(){let domain='未配置';try{domain=new URL(state.control.site.url).hostname}catch{}document.getElementById('control-body').innerHTML=`<section class="settings-section control-setting-form"><h2>公开域名与 HTTPS</h2><p class="settings-description">站点域名来自站点设置。证书通常由 Nginx 或部署系统终止与维护，应用内不重复管理私钥。</p><dl class="domain-facts"><div class="info-item"><dt>公开地址</dt><dd>${esc(state.control.site.url)}</dd></div><div class="info-item"><dt>站点域名</dt><dd>${esc(domain)}</dd></div><div class="info-item"><dt>证书维护位置</dt><dd>Nginx / 部署系统</dd></div><div class="info-item"><dt>到期时间 / 最近检查</dt><dd>尚未接入检查，不显示虚构日期</dd></div></dl><div class="certificate-state">证书状态：尚未检查<p>后续接入检查后显示域名匹配、有效期、到期提醒与错误原因。当前没有执行网络检查。</p></div><div class="settings-footer"><span class="tiny muted">Worker 的公开网关地址在对应节点管理。第一版不提供网页上传私钥或自动续签。</span><button class="btn secondary" id="domain-site-settings">修改站点地址</button></div></section>`;document.getElementById('domain-site-settings').onclick=()=>{controllerTab='site';controlPage()}}

try{document.documentElement.dataset.theme=localStorage.getItem('attackbox-admin-theme')==='dark'?'dark':'light'}catch{}function syncTheme(){document.querySelectorAll('.theme-switch [data-theme]').forEach(b=>{const active=b.dataset.theme===document.documentElement.dataset.theme;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}document.querySelectorAll('.theme-switch [data-theme]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.theme;try{localStorage.setItem('attackbox-admin-theme',b.dataset.theme)}catch{}syncTheme()});syncTheme();document.addEventListener('click',e=>{if(!document.getElementById('user').contains(e.target))document.getElementById('user').open=false});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(save())toast('草稿已保存')}if(e.key==='Escape')document.getElementById('user').open=false});window.addEventListener('beforeunload',e=>{if(unsaved){e.preventDefault();e.returnValue=''}});window.addEventListener('hashchange',render);render();
</script></body></html>
